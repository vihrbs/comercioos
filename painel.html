<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#7C3AED">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ComercioOS">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-apple.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComercioOS — Gestão de Lojas</title>
<style>
  :root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --primary-light: #e0e7ff;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --info: #3b82f6;
    --bg: #f1f5f9;
    --surface: #ffffff;
    --surface2: #f8fafc;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-muted: #64748b;
    --text-light: #94a3b8;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -1px rgba(0,0,0,.06);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.1);
    --radius: 12px;
    --sidebar-w: 240px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }
  
  /* AUTH */
  #auth-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  }
  .auth-box {
    background: white; border-radius: 20px; padding: 40px; width: 420px;
    box-shadow: var(--shadow-lg);
  }
  .auth-logo { text-align: center; margin-bottom: 32px; }
  .auth-logo .logo-icon {
    width: 64px; height: 64px; background: var(--primary); border-radius: 16px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 28px; margin-bottom: 12px;
  }
  .auth-logo h1 { font-size: 26px; font-weight: 800; color: var(--text); }
  .auth-logo p { color: var(--text-muted); font-size: 14px; }
  .auth-tabs { display: flex; gap: 4px; background: var(--bg); border-radius: 10px; padding: 4px; margin-bottom: 24px; }
  .auth-tab {
    flex: 1; padding: 9px; border: none; background: transparent; border-radius: 8px;
    cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text-muted); transition: all .2s;
  }
  .auth-tab.active { background: white; color: var(--primary); box-shadow: var(--shadow); }

  /* LAYOUT */
  #app { display: none; min-height: 100vh; }
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0; width: 240px;
    background: var(--text); display: flex; flex-direction: column; z-index: 200;
    transition: transform .28s cubic-bezier(.4,0,.2,1);
  }
  .sidebar-brand {
    padding: 20px; border-bottom: 1px solid rgba(255,255,255,.1);
    display: flex; align-items: center; gap: 12px;
  }
  .brand-icon {
    width: 38px; height: 38px; background: var(--primary); border-radius: 10px;
    display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
  }
  .brand-name { color: white; font-size: 18px; font-weight: 800; }
  .brand-sub { color: var(--text-light); font-size: 11px; }
  .sidebar-nav { flex: 1; padding: 12px 8px; overflow-y: auto; }
  .nav-section { margin-bottom: 4px; }
  .nav-label {
    padding: 6px 12px; font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; color: var(--text-light);
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-radius: 8px; cursor: pointer; transition: all .15s;
    color: rgba(255,255,255,.7); font-size: 14px; font-weight: 500; text-decoration: none;
    border: none; background: none; width: 100%; text-align: left;
  }
  .nav-item:hover { background: rgba(255,255,255,.08); color: white; }
  .nav-item.active { background: var(--primary); color: white; }
  .nav-item .nav-icon { font-size: 16px; width: 20px; text-align: center; }
  .sidebar-footer {
    padding: 12px 8px; border-top: 1px solid rgba(255,255,255,.1);
  }
  .user-info {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px;
  }
  .avatar {
    width: 34px; height: 34px; background: var(--primary); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: white; flex-shrink: 0;
  }
  .user-name { color: white; font-size: 13px; font-weight: 600; }
  .user-role { color: var(--text-light); font-size: 11px; }

  .main { margin-left: 240px; display: flex; flex-direction: column; min-height: 100vh; }
  .topbar {
    background: white; border-bottom: 1px solid var(--border); padding: 0 16px 0 24px;
    height: 64px; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 50;
  }
  .topbar-title { font-size: 20px; font-weight: 700; color: var(--text); }
  .topbar-actions { display: flex; align-items: center; gap: 10px; }
  .content { flex: 1; padding: 24px; }

  /* COMPONENTS */
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 16px; border-radius: 9px; border: none; cursor: pointer;
    font-size: 14px; font-weight: 600; transition: all .15s; text-decoration: none;
  }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-success { background: var(--success); color: white; }
  .btn-danger { background: var(--danger); color: white; }
  .btn-warning { background: var(--warning); color: white; }
  .btn-outline { background: white; color: var(--text); border: 1px solid var(--border); }
  .btn-outline:hover { background: var(--bg); }
  .btn-ghost { background: transparent; color: var(--text-muted); }
  .btn-ghost:hover { background: var(--bg); color: var(--text); }
  .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 7px; }
  .btn-icon { padding: 8px; border-radius: 8px; }

  .card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .card-title { font-size: 16px; font-weight: 700; color: var(--text); }

  .stat-card {
    background: white; border-radius: var(--radius); padding: 20px;
    box-shadow: var(--shadow); display: flex; align-items: flex-start; gap: 14px;
  }
  .stat-icon {
    width: 48px; height: 48px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0;
  }
  .stat-value { font-size: 26px; font-weight: 800; color: var(--text); line-height: 1; }
  .stat-label { font-size: 13px; color: var(--text-muted); margin-top: 3px; }
  .stat-change { font-size: 12px; font-weight: 600; margin-top: 4px; }
  .stat-up { color: var(--success); }
  .stat-down { color: var(--danger); }

  .grid { display: grid; gap: 16px; }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-2 { grid-template-columns: repeat(2, 1fr); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .5px; color: var(--text-muted); border-bottom: 2px solid var(--border); }
  td { padding: 12px 14px; font-size: 14px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }

  .badge {
    display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 20px;
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px;
  }
  .badge-green { background: #d1fae5; color: #065f46; }
  .badge-red { background: #fee2e2; color: #991b1b; }
  .badge-yellow { background: #fef3c7; color: #92400e; }
  .badge-blue { background: #dbeafe; color: #1e40af; }
  .badge-purple { background: #ede9fe; color: #5b21b6; }
  .badge-gray { background: #f1f5f9; color: #475569; }

  /* FORMS */
  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  input, select, textarea {
    width: 100%; padding: 10px 13px; border: 1.5px solid var(--border); border-radius: 9px;
    font-size: 14px; color: var(--text); background: white; transition: border-color .15s;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
  .input-group { display: flex; gap: 8px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200;
    display: flex; align-items: center; justify-content: center; padding: 20px;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: white; border-radius: 16px; width: 100%; max-height: 90vh;
    overflow-y: auto; box-shadow: var(--shadow-lg);
    transform: translateY(20px); transition: transform .2s;
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-sm { max-width: 420px; }
  .modal-md { max-width: 580px; }
  .modal-lg { max-width: 760px; }
  .modal-xl { max-width: 960px; }
  .modal-header {
    padding: 20px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: white; z-index: 1;
  }
  .modal-title { font-size: 18px; font-weight: 700; }
  .modal-body { padding: 24px; }
  .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }

  /* PDV */
  .pdv-layout { display: grid; grid-template-columns: 1fr 360px; gap: 12px; height: calc(100vh - 112px); }
  .pdv-products { background: white; border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; }
  .pdv-cart { background: white; border-radius: var(--radius); box-shadow: var(--shadow); display: flex; flex-direction: column; }
  .pdv-search { padding: 16px; border-bottom: 1px solid var(--border); }
  .pdv-cats { display: flex; gap: 6px; padding: 12px 16px; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .pdv-cat-btn {
    padding: 5px 14px; border-radius: 20px; border: 1.5px solid var(--border);
    background: white; cursor: pointer; font-size: 12px; font-weight: 600; white-space: nowrap;
    color: var(--text-muted); transition: all .15s;
  }
  .pdv-cat-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
  .pdv-grid { flex: 1; overflow-y: auto; padding: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .pdv-product-card {
    background: var(--bg); border-radius: 10px; padding: 12px; cursor: pointer;
    transition: all .15s; border: 2px solid transparent; text-align: center;
  }
  .pdv-product-card:hover { border-color: var(--primary); background: var(--primary-light); }
  .pdv-product-card .prod-icon { font-size: 28px; margin-bottom: 6px; }
  .pdv-product-card .prod-name { font-size: 12px; font-weight: 600; color: var(--text); line-height: 1.3; margin-bottom: 4px; }
  .pdv-product-card .prod-price { font-size: 13px; font-weight: 800; color: var(--primary); }
  .pdv-product-card .prod-stock { font-size: 10px; color: var(--text-muted); }
  .cart-header { padding: 16px; border-bottom: 1px solid var(--border); }
  .cart-customer { padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .cart-items { flex: 1; overflow-y: auto; padding: 8px; }
  .cart-item {
    display: flex; align-items: center; gap: 10px; padding: 10px;
    border-radius: 8px; border: 1px solid var(--border); margin-bottom: 6px;
  }
  .cart-item-info { flex: 1; min-width: 0; }
  .cart-item-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cart-item-detail { font-size: 11px; color: var(--text-muted); }
  .qty-control { display: flex; align-items: center; gap: 6px; }
  .qty-btn {
    width: 26px; height: 26px; border-radius: 6px; border: 1.5px solid var(--border);
    background: white; cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700; color: var(--text);
  }
  .qty-btn:hover { background: var(--bg); }
  .qty-num { font-size: 14px; font-weight: 700; min-width: 24px; text-align: center; }
  .cart-total { padding: 12px 16px; border-top: 1px solid var(--border); }
  .total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 14px; }
  .total-row.big { font-size: 22px; font-weight: 800; color: var(--primary); }
  .cart-payment { padding: 12px 16px; border-top: 1px solid var(--border); }
  .payment-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
  .payment-btn {
    padding: 10px 6px; border: 2px solid var(--border); border-radius: 9px;
    background: white; cursor: pointer; text-align: center; transition: all .15s;
    font-size: 12px; font-weight: 700; color: var(--text-muted);
  }
  .payment-btn.active { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
  .cart-actions { padding: 12px 16px; }

  /* EMPTY STATE */
  .empty-state { text-align: center; padding: 48px 20px; }
  .empty-icon { font-size: 56px; margin-bottom: 16px; opacity: .5; }
  .empty-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .empty-text { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }

  /* ALERTS */
  .toast-container { position: fixed; top: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: white; border-radius: 10px; padding: 14px 18px; box-shadow: var(--shadow-lg);
    border-left: 4px solid var(--success); font-size: 14px; font-weight: 600;
    animation: slideIn .3s ease; max-width: 320px;
  }
  .toast.error { border-left-color: var(--danger); }
  .toast.warning { border-left-color: var(--warning); }
  .toast.info { border-left-color: var(--info); }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  /* LOADING */
  .spinner {
    display: inline-block; width: 20px; height: 20px;
    border: 2px solid var(--border); border-top-color: var(--primary);
    border-radius: 50%; animation: spin .6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-overlay {
    position: absolute; inset: 0; background: rgba(255,255,255,.8);
    display: flex; align-items: center; justify-content: center; border-radius: var(--radius); z-index: 10;
  }

  /* SEARCH BAR */
  .search-bar {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: var(--bg); border-radius: 10px; border: 1.5px solid transparent;
    transition: border-color .15s; flex: 1;
  }
  .search-bar:focus-within { border-color: var(--primary); background: white; }
  .search-bar input { background: none; border: none; outline: none; padding: 0; flex: 1; font-size: 14px; }

  /* CHARTS */
  .chart-bar { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding-top: 10px; }
  .chart-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .bar {
    width: 100%; background: var(--primary); border-radius: 4px 4px 0 0;
    transition: height .3s; min-height: 2px;
  }
  .bar-label { font-size: 10px; color: var(--text-muted); }
  .bar-value { font-size: 10px; font-weight: 700; color: var(--primary); }

  /* TABS */
  .tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
  .tab-btn {
    padding: 10px 18px; border: none; background: none; cursor: pointer;
    font-size: 14px; font-weight: 600; color: var(--text-muted);
    border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all .15s;
  }
  .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

  /* VARIAÇÕES */
  .variacao-row { display: flex; gap: 8px; align-items: center; padding: 10px; background: var(--bg); border-radius: 8px; margin-bottom: 6px; }
  .variacao-row input { background: white; }

  /* PROGRESS */
  .progress { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .progress-bar { height: 100%; background: var(--primary); border-radius: 4px; transition: width .3s; }

  /* CREDIÁRIO / PAGAMENTO */
  .payment-option { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .payment-option input[type=radio] { width: auto; }

  /* TAGS */
  .tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; background: var(--primary-light); color: var(--primary); border-radius: 20px; font-size: 12px; font-weight: 600; }

  /* RESPONSIVE helpers */
  .flex { display: flex; }
  .flex-col { flex-direction: column; }
  .items-center { align-items: center; }
  .justify-between { justify-content: space-between; }
  .gap-2 { gap: 8px; }
  .gap-3 { gap: 12px; }
  .gap-4 { gap: 16px; }
  .mt-1 { margin-top: 4px; }
  .mt-2 { margin-top: 8px; }
  .mt-3 { margin-top: 12px; }
  .mt-4 { margin-top: 16px; }
  .mb-1 { margin-bottom: 4px; }
  .mb-2 { margin-bottom: 8px; }
  .mb-4 { margin-bottom: 16px; }
  .text-sm { font-size: 13px; }
  .text-xs { font-size: 11px; }
  .text-muted { color: var(--text-muted); }
  .font-bold { font-weight: 700; }
  .w-full { width: 100%; }
  .hidden { display: none; }

  @media (max-width: 1100px) {
    .grid-4 { grid-template-columns: repeat(2, 1fr); }
  }
  .hamburger { display: none; background: none; border: none; cursor: pointer; padding: 8px; border-radius: 8px; color: var(--text-primary); }
  .hamburger:hover { background: var(--bg); }
  .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 199; opacity: 0; pointer-events: none; transition: opacity .28s; display: none; }

  /* PERFIL SELECTOR */
  .perfil-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; padding: 20px 0; }
  .perfil-card { background: var(--surface); border: 2px solid var(--border); border-radius: 16px; padding: 24px 16px; text-align: center; cursor: pointer; transition: all .15s; }
  .perfil-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .perfil-avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--primary-light); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; color: var(--primary); margin: 0 auto 10px; }
  .perfil-nome { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .perfil-cargo { font-size: 12px; color: var(--text-muted); }

  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .main { margin-left: 0 !important; }
    .sidebar.open { transform: translateX(0); box-shadow: 4px 0 20px rgba(0,0,0,.3); }
    .sidebar-overlay { display: block; }
    .sidebar-overlay.open { opacity: 1; pointer-events: all; }
    .hamburger { display: flex; align-items: center; justify-content: center; }
    .topbar { left: 0 !important; }
    .grid-3, .grid-2 { grid-template-columns: 1fr; }
    .pdv-layout { grid-template-columns: 1fr !important; grid-template-rows: auto auto; height: auto !important; }
    .pdv-products { height: 52vh; min-height: 300px; }
    .pdv-cart { max-height: 55vh; overflow-y: auto; }
    .pdv-grid { grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)) !important; gap: 7px; }
    .pdv-product-card { padding: 10px 6px !important; }
    .pdv-product-card .prod-icon { font-size: 24px !important; }
    .pdv-product-card .prod-name { font-size: 11px !important; }
    .cart-customer { display: flex; flex-direction: column; gap: 6px; }
    .payment-methods { grid-template-columns: repeat(3, 1fr) !important; }
  }
</style>
</head>
<body>

<!-- TOAST -->
<div class="toast-container" id="toastContainer"></div>

<!-- AUTH -->
<!-- SELETOR DE PERFIL (recepcionista) -->
<div id="perfil-screen" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:150;overflow-y:auto">
  <div style="max-width:520px;margin:0 auto;padding:40px 20px">
    <div style="text-align:center;margin-bottom:32px">
      <div style="font-size:48px;margin-bottom:8px">🛍️</div>
      <h2 style="font-size:22px;font-weight:800;margin-bottom:6px" id="perfil-loja-nome">ComercioOS</h2>
      <p style="color:var(--text-muted);font-size:14px">Quem está usando agora?</p>
    </div>
    <div class="perfil-grid" id="perfil-lista"></div>
    <div style="margin-top:32px;text-align:center;border-top:1px solid var(--border);padding-top:20px">
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:12px">Você é o administrador?</p>
      <button class="btn btn-outline btn-sm" onclick="voltarLogin()">🔐 Entrar com senha de admin</button>
    </div>
  </div>
</div>

// ============================================================

async function api(method, path, body) {
  const res = await fetch(API + path, {
    method,
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${STATE.token}` },
    body: body ? JSON.stringify(body) : undefined
  });

  // Token expirado — força novo login
  if (res.status === 401) {
    localStorage.removeItem('comercioos_token');
    STATE.token = null;
    document.getElementById('app').style.display = 'none';
    document.getElementById('auth-screen').style.display = 'flex';
    toast('Sessão expirada. Faça login novamente.', 'warning');
    throw new Error('Sessão expirada');
  }

  const data = await res.json().catch(() => ({ error: 'Resposta inválida do servidor' }));
  if (!res.ok) throw new Error(data.error || 'Erro ' + res.status);
  return data;
}

function mockApi(method, path, body) {
  // Simula delay da API
  return new Promise(resolve => setTimeout(() => {
    if (path === '/api/relatorios/dashboard') {
      const hoje = new Date().toISOString().split('T')[0];
      const vendasHoje = STATE.vendas.filter(v => v.criado_em.startsWith(hoje));
      const totalHoje = vendasHoje.reduce((s, v) => s + v.total, 0);
      const totalMes = STATE.vendas.reduce((s, v) => s + v.total, 0);
      const pagamentos = {};
      STATE.vendas.forEach(v => { pagamentos[v.forma_pagamento] = (pagamentos[v.forma_pagamento] || 0) + v.total; });
      resolve({
        hoje: { total: totalHoje, num_vendas: vendasHoje.length, ticket_medio: vendasHoje.length ? totalHoje / vendasHoje.length : 0 },
        mes: { total: totalMes, num_vendas: STATE.vendas.length, por_pagamento: pagamentos },
        totais: { clientes: STATE.clientes.length, produtos: STATE.produtos.length },
        ultimas_vendas: STATE.vendas.slice(0, 5),
        top_produtos: [
          { nome: 'Vestido Midi', qtd: 12, total: 2638.80 },
          { nome: 'Calça Jeans Skinny', qtd: 9, total: 1349.10 },
          { nome: 'Bolsa de Couro', qtd: 7, total: 2099.30 },
          { nome: 'Blusa Floral', qtd: 15, total: 1348.50 },
          { nome: 'Tênis Casual', qtd: 5, total: 949.50 }
        ],
        estoque_critico: STATE.produtos.flatMap(p => p.variacoes.filter(v => v.estoque <= v.estoque_minimo).map(v => ({ ...v, produto_nome: p.nome })))
      });
    } else if (path.startsWith('/api/vendas') && method === 'POST') {
      const venda = { ...body, id: 'vd' + Date.now(), numero: `V-${String(STATE.vendas.length + 1).padStart(5,'0')}`, status: 'finalizada', criado_em: new Date().toISOString() };
      STATE.vendas.unshift(venda);
      resolve(venda);
    } else {
      resolve({ success: true });
    }
  }, 300));
}

function switchAuthTab(tab) {
  document.querySelectorAll('.auth-tab').forEach((t, i) => t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register')));
  document.getElementById('tab-login').classList.toggle('hidden', tab !== 'login');
  document.getElementById('tab-register').classList.toggle('hidden', tab !== 'register');
}

async function doLogin() {
  const email = document.getElementById('login-email').value;
  const senha = document.getElementById('login-senha').value;
  if (!email || !senha) return toast('Preencha email e senha', 'error');

  try {
    const res = await fetch(API + '/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, senha })
    });
    const data = await res.json();
    if (!res.ok) return toast(data.error, 'error');
    localStorage.setItem('comercioos_token', data.token);
    STATE.token = data.token; STATE.user = data.usuario; STATE.loja = data.loja;
    mostrarSeletorPerfil(data.loja, { token: data.token, usuario: data.usuario, loja: data.loja });
  } catch (e) {
    toast('Erro ao conectar ao servidor. Verifique sua conexão.', 'error');
  }
}

async function doRegister() {
  const nome_loja = document.getElementById('reg-loja').value.trim();
  const nome = document.getElementById('reg-nome').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const telefone = document.getElementById('reg-telefone').value.trim();
  const senha = document.getElementById('reg-senha').value;
  if (!nome_loja || !nome || !email || !senha || !telefone) return toast('Preencha todos os campos obrigatórios', 'error');
  if (senha.length < 6) return toast('Senha precisa ter no mínimo 6 caracteres', 'error');

  const btn = document.querySelector('#tab-register .btn-primary');
  if (btn) { btn.textContent = 'Criando conta...'; btn.disabled = true; }

  try {
    const res = await fetch(API + '/api/auth/register', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nome_loja, nome, email, senha, telefone: telefone || null })
    });
    const data = await res.json();
    if (!res.ok) { toast(data.error || 'Erro ao criar conta', 'error'); return; }

    localStorage.setItem('comercioos_token', data.token);
    STATE.token = data.token; STATE.user = data.usuario; STATE.loja = data.loja;
    toast(`Conta criada! Bem-vindo, ${nome.split(' ')[0]}! 🎉`, 'success');
    startApp();
  } catch (e) {
    toast('Erro ao conectar ao servidor. Verifique sua conexão.', 'error');
  } finally {

let _pinUsuario = null;

async function mostrarSeletorPerfil(loja, usuarioAdmin) {
  // Carrega todos os usuários da loja
  STATE.token = usuarioAdmin.token;
  STATE.user = usuarioAdmin.usuario;
  STATE.loja = usuarioAdmin.loja || loja;

  let usuarios = [];
  try {
    usuarios = await api('GET', '/api/auth/usuarios');
  } catch(e) {
    // Se falhar, vai direto pro app como admin
    startApp();
    return;
  }

  // Só mostra seletor se tiver mais de 1 usuário ativo
  const ativos = usuarios.filter(u => u.ativo !== false);
  if (ativos.length <= 1) {
    startApp();
    return;
  }

  // Mostra tela de seleção
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('perfil-screen').style.display = 'block';
  document.getElementById('perfil-loja-nome').textContent = STATE.loja?.nome || 'ComercioOS';

  const lista = document.getElementById('perfil-lista');
  lista.innerHTML = ativos.map(u => `
    <div class="perfil-card" onclick="selecionarPerfil('${u.id}','${u.nome.replace(/'/g,"\'")}','${u.perfil}')">
      <div class="perfil-avatar">${u.nome[0].toUpperCase()}</div>
      <div class="perfil-nome">${u.nome}</div>
      <div class="perfil-cargo">${u.cargo || (u.perfil === 'admin' ? 'Administrador' : 'Recepção')}</div>
    </div>
  `).join('');

  // Salva lista de usuários para busca posterior
  window._usuariosLoja = ativos;
  window._adminCredentials = usuarioAdmin;
}

function selecionarPerfil(uid, nome, perfil) {
  const u = (window._usuariosLoja || []).find(x => x.id === uid);
  if (!u) return;

  // Admin vai direto (já tem o token)
  if (u.id === STATE.user?.id && perfil === 'admin') {
    document.getElementById('perfil-screen').style.display = 'none';
    startApp();
    return;
  }

  // Outros precisam de senha
  _pinUsuario = u;
  const overlay = document.getElementById('pin-overlay');
  document.getElementById('pin-avatar').textContent = nome[0].toUpperCase();
  document.getElementById('pin-nome').textContent = nome;
  document.getElementById('pin-senha').value = '';
  document.getElementById('pin-erro').textContent = '';
  overlay.style.display = 'flex';
  setTimeout(() => document.getElementById('pin-senha').focus(), 100);
}

async function confirmarPinLogin() {
  const senha = document.getElementById('pin-senha').value;
  if (!senha) return;
  const btn = document.getElementById('pin-btn');
  btn.textContent = 'Verificando...'; btn.disabled = true;
  document.getElementById('pin-erro').textContent = '';

  try {
    // Faz login com as credenciais do recepcionista
    const res = await fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: _pinUsuario.email, senha })
    });
    const data = await res.json();
    if (!res.ok) {
      document.getElementById('pin-erro').textContent = 'Senha incorreta';
      return;
    }

    // Login do recepcionista
    localStorage.setItem('comercioos_token', data.token);
    STATE.token = data.token;
    STATE.user = data.usuario;
    STATE.loja = data.loja || STATE.loja;

    fecharPin();
    document.getElementById('perfil-screen').style.display = 'none';
    startApp();
  } catch(e) {
    document.getElementById('pin-erro').textContent = 'Erro de conexão';
  } finally {
    btn.textContent = 'Entrar'; btn.disabled = false;
  }
}

function fecharPin() {
  document.getElementById('pin-overlay').style.display = 'none';
  _pinUsuario = null;
}

function voltarLogin() {
  document.getElementById('perfil-screen').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
}

// Enter no PIN
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.getElementById('pin-overlay').style.display === 'flex') {
    confirmarPinLogin();
  }
});

      <input type="checkbox" value="${m}" name="nova-perm" style="accent-color:var(--primary)"

async function salvarNovoUsuario() {
  const nome = document.getElementById('nu-nome').value.trim();
  const email = document.getElementById('nu-email').value.trim();
  const cargo = document.getElementById('nu-cargo').value.trim();
  const senha = document.getElementById('nu-senha').value;
  if (!nome || !email || !senha) return toast('Nome, email e senha obrigatórios', 'error');
  if (senha.length < 6) return toast('Senha mínimo 6 caracteres', 'error');
  const permissoes = [...document.querySelectorAll('[name=nova-perm]:checked')].map(c=>c.value);
  if (!permissoes.includes('dashboard')) permissoes.unshift('dashboard');

  try {
    await api('POST', '/api/auth/usuarios', { nome, email, senha, cargo: cargo||null, perfil: 'custom', permissoes });
    toast('Usuário criado!', 'success');
    closeModal();
    renderUsuarios();
  } catch(e) { toast('Erro: ' + e.message, 'error'); }
}

function modalEditarUsuario(uid, nome, permsAtuais) {
  const permsHtml = TODOS_MODULOS.map(m =>
    `<label style="display:flex;align-items:center;gap:7px;padding:6px 8px;border:1px solid var(--border);border-radius:7px;cursor:pointer;font-size:12px">

        ${permsAtuais.includes(m)?'checked':''}> ${MODULOS_LABEL[m]}
    </label>`
  ).join('');

  openModal(`✏️ Permissões — ${nome}`, `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${permsHtml}</div>
    <div class="flex gap-2 mt-2">
      <button type="button" class="btn btn-outline btn-sm" onclick="document.querySelectorAll('[name=edit-perm]').forEach(c=>c.checked=true)">Marcar todas</button>
      <button type="button" class="btn btn-ghost btn-sm" onclick="document.querySelectorAll('[name=edit-perm]').forEach(c=>c.checked=false)">Desmarcar</button>

    <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="salvarPermissoes('${uid}')">Salvar</button>
  `);
}

async function salvarPermissoes(uid) {
  const permissoes = [...document.querySelectorAll('[name=edit-perm]:checked')].map(c=>c.value);
  if (!permissoes.includes('dashboard')) permissoes.unshift('dashboard');
  try {
    await api('PUT', '/api/auth/usuarios/'+uid+'/permissoes', { permissoes });
    toast('Permissões atualizadas!', 'success');
    closeModal();
    renderUsuarios();
  } catch(e) { toast('Erro: ' + e.message, 'error'); }
}

async function deletarUsuario(uid, nome) {
  if (!confirm(`Remover ${nome}? Ele não conseguirá mais fazer login.`)) return;
  try {
    await api('DELETE', '/api/auth/usuarios/'+uid);
    toast('Usuário removido!', 'success');
    renderUsuarios();
  } catch(e) { toast('Erro: ' + e.message, 'error'); }
}

function startApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  // Aplica permissões do usuário
  const perms = STATE.user?.permissoes;
  if (STATE.user?.perfil !== 'admin' && perms && perms.length > 0) {
    STATE._permissoes = perms;
    // Esconde itens do menu sem permissão
    document.querySelectorAll('.nav-item[onclick]').forEach(el => {
      const oc = el.getAttribute('onclick') || '';
      const match = oc.match(/navigate\(['"]([^'"]+)['"]\)/);
      if (match && !perms.includes(match[1])) el.style.display = 'none';
    });
  } else {
    STATE._permissoes = null;
    document.querySelectorAll('.nav-item').forEach(el => el.style.display = '');
  }
  // Painel Admin é da PLATAFORMA, não de uma loja — só aparece pra super admin
  if (STATE.user?.super_admin) {
    const secPlataforma = document.getElementById('nav-section-plataforma');
    if (secPlataforma) secPlataforma.style.display = '';
  }
  updateSidebar();
  navigate('dashboard');
  toast(`Bem-vindo, ${STATE.user.nome.split(' ')[0]}! 👋`, 'success');
  carregarDadosBase();
  setTimeout(function(){_showPWABanner();}, 4000);
}

async function carregarDadosBase() {
  try {
    const [cats, prods, clis, funcs, caixa] = await Promise.allSettled([
      api('GET', '/api/categorias'),
      api('GET', '/api/produtos?limit=500'),
      api('GET', '/api/clientes?limit=500'),
      api('GET', '/api/operacoes/funcionarios'),
      api('GET', '/api/operacoes/caixa/atual')
    ]);
    if (cats.status === 'fulfilled') STATE.categorias = Array.isArray(cats.value) ? cats.value : [];
    if (prods.status === 'fulfilled') STATE.produtos = prods.value?.data || (Array.isArray(prods.value) ? prods.value : []);
    if (clis.status === 'fulfilled') STATE.clientes = clis.value?.data || (Array.isArray(clis.value) ? clis.value : []);
    if (funcs.status === 'fulfilled') STATE.funcionarios = Array.isArray(funcs.value) ? funcs.value : [];
    if (caixa.status === 'fulfilled' && caixa.value) { STATE.caixaAtual = caixa.value; updateSidebar(); }
    // Recarrega página atual se estiver em produtos/estoque/clientes/PDV
    const pg = STATE.currentPage;
    if (['produtos','estoque','clientes','pdv'].includes(pg)) {
      const renders = { produtos: renderProdutos, estoque: renderEstoque, clientes: renderClientes, pdv: renderPDV };
      if (renders[pg]) renders[pg]();
    }
  } catch(e) {
    console.warn('carregarDadosBase erro:', e);
  }
}

function updateSidebar() {
  const u = STATE.user; const l = STATE.loja;
  document.getElementById('sidebar-loja-nome').textContent = l?.nome || '';
  document.getElementById('sidebar-user-name').textContent = u?.nome || '';
  document.getElementById('sidebar-user-role').textContent = u?.perfil || '';
  document.getElementById('sidebar-avatar').textContent = (u?.nome || 'U')[0].toUpperCase();
  const caixaStatusEl = document.getElementById('caixa-status');
  if (caixaStatusEl) {
    caixaStatusEl.innerHTML = STATE.caixaAtual?.status === 'aberto'
      ? `<span class="badge badge-green">🟢 Caixa aberto</span>`
      : '';
  }
}

function logout() {
  localStorage.removeItem('comercioos_token');
  location.reload();
}

function navigate(page) {
  // Verifica permissão se não for admin (super admin da plataforma sempre pode ver 'admin')
  if (STATE.user?.perfil !== 'admin' && !STATE.user?.super_admin && STATE._permissoes && !STATE._permissoes.includes(page) && page !== 'dashboard') {
    toast('Sem permissão para acessar esta área', 'error');
    return;
  }
  closeSidebar();
  STATE.currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navBtns = document.querySelectorAll('.nav-item');
  navBtns.forEach(btn => { if (btn.textContent.toLowerCase().includes(page.split('/')[0].replace('-',' '))) btn.classList.add('active'); });
  
  const titles = {
    dashboard: 'Dashboard', pdv: '🛒 PDV — Ponto de Venda', produtos: 'Produtos',

    funcionarios: 'Funcionários', comissoes: 'Comissões', relatorios: 'Relatórios',
    configuracoes: 'Configurações', admin: '🛡️ Painel Admin — Plataforma'
  };
  document.getElementById('page-title').textContent = titles[page] || page;
  
  const renders = {
    dashboard: renderDashboard, pdv: renderPDV, produtos: renderProdutos,
    estoque: renderEstoque, clientes: renderClientes, pedidos: renderPedidos,
    vendas: renderVendas, trocas: renderTrocas, financeiro: renderFinanceiro, crediario: renderCrediario,
    funcionarios: renderFuncionarios, comissoes: renderComissoes, relatorios: renderRelatorios,

}

          <span class="card-title">⏱ Últimas Vendas</span>
          <button class="btn btn-ghost btn-sm" onclick="navigate('vendas')">Ver todas →</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Nº</th><th>Cliente</th><th>Total</th><th>Pagamento</th><th>Status</th></tr></thead>
            <tbody>
              ${(data.ultimas_vendas||[]).map(v => `
                <tr onclick="verVenda('${v.id}')" style="cursor:pointer" title="Ver comanda">
                  <td><span class="font-bold">${v.numero}</span></td>

      <div class="card">
        <div class="card-header">

          <button class="btn btn-ghost btn-sm" onclick="navigate('estoque')">Ver estoque →</button>

          </table></div>`}

        ${[
          { icon:'🛒', label:'Nova Venda', page:'pdv' },
          { icon:'👗', label:'Novo Produto', action:'openProdutoModal()' },
          { icon:'👥', label:'Novo Cliente', action:'openClienteModal()' },
          { icon:'💳', label:'Financeiro', page:'financeiro' },

            <span style="font-size:13px">${i.label}</span>

function pagBadge(p) {
  const map = { pix:'badge-blue', dinheiro:'badge-green', credito:'badge-purple', debito:'badge-gray', crediario:'badge-yellow' };
  const lbl = { pix:'PIX', dinheiro:'Dinheiro', credito:'Crédito', debito:'Débito', crediario:'Crediário' };
  return `<span class="badge ${map[p]||'badge-gray'}">${lbl[p]||p}</span>`;
}

// ============================================================
//  PDV
// ============================================================
const PAGAMENTO_ICONS = { dinheiro:'💵', pix:'⚡', debito:'💳', credito:'💰', crediario:'📅', credito_loja:'🎁' };
const PAGAMENTO_LABELS = { dinheiro:'Dinheiro', pix:'PIX', debito:'Débito', credito:'Crédito', crediario:'Crediário', credito_loja:'Crédito de loja' };

async function renderPDV() {
  loading();
  try {
    const [pd,cd,cld,fnd] = await Promise.allSettled([
      api('GET','/api/produtos?limit=500'),
      api('GET','/api/categorias'),
      api('GET','/api/clientes?limit=500'),
      api('GET','/api/operacoes/funcionarios')
    ]);
    if(pd.status==='fulfilled') STATE.produtos = pd.value?.data || (Array.isArray(pd.value)?pd.value:[]);
    if(cd.status==='fulfilled') STATE.categorias = Array.isArray(cd.value)?cd.value:[];
    if(cld.status==='fulfilled') STATE.clientes = cld.value?.data || (Array.isArray(cld.value)?cld.value:[]);
    if(fnd.status==='fulfilled') STATE.funcionarios = Array.isArray(fnd.value)?fnd.value:[];
  } catch(e) { console.warn('PDV load:', e); }
  const cats = [{ id: null, nome: 'Todos' }, ...STATE.categorias];
  const catsHtml = cats.map(c => `<button class="pdv-cat-btn ${STATE.pdvCatFilter === c.id ? 'active' : ''}" onclick="pdvSetCat('${c.id}')">${c.nome}</button>`).join('');

  setContent(`
    <div class="pdv-layout">
      <!-- PRODUTOS -->
      <div class="pdv-products">
        <div class="pdv-search">
          <div class="search-bar" style="margin-bottom:8px;border:1.5px solid var(--primary-light)">
            <span>📷</span>
            <input type="text" id="pdv-barcode" placeholder="Bipe o código de barras e tecle Enter..." onkeydown="handleBarcodeEnter(event)" autofocus>
          </div>
          <div class="search-bar">
            <span>🔍</span>
            <input type="text" id="pdv-search" placeholder="Buscar produto por nome..." oninput="renderPDVGrid()">
          </div>
        </div>
        <div class="pdv-cats" id="pdv-cats">${catsHtml}</div>
        <div class="pdv-grid" id="pdv-grid"></div>
      </div>

      <!-- CARRINHO -->
      <div class="pdv-cart">
        <div class="cart-header">
          <div class="flex items-center justify-between">
            <span class="font-bold" style="font-size:16px">🛒 Carrinho</span>
            <button class="btn btn-ghost btn-sm" onclick="clearCart()">Limpar</button>
          </div>
        </div>

        <div class="cart-customer">
          <div class="flex items-center gap-2">
            <span style="font-size:13px;color:var(--text-muted)">👤 Cliente:</span>
            <select id="cart-cliente" style="flex:1;font-size:13px;padding:6px 10px" onchange="setCartCliente(this.value)">
              <option value="">— Consumidor —</option>
              ${STATE.clientes.map(c => `<option value="${c.id}">${c.nome}</option>`).join('')}
            </select>
            <button class="btn btn-outline btn-sm" onclick="modalClienteRapido()" title="Cadastrar cliente novo">+ Novo</button>
          </div>
          <div class="flex items-center gap-2 mt-2">
            <span style="font-size:13px;color:var(--text-muted)">👗 Vendedor:</span>
            <select id="cart-func" style="flex:1;font-size:13px;padding:6px 10px">
              <option value="">— Nenhum —</option>
              ${STATE.funcionarios.map(f => `<option value="${f.id}">${f.nome}</option>`).join('')}
            </select>
          </div>
        </div>

        <div class="cart-items" id="cart-items">
          <div class="empty-state" style="padding:24px">
            <div class="empty-icon" style="font-size:40px">🛍️</div>
            <p class="empty-text">Adicione produtos ao carrinho</p>
          </div>
        </div>

        <div class="cart-total" id="cart-total"></div>

        <div class="cart-payment">
          <div class="flex items-center justify-between mb-2">
            <span style="font-size:12px;font-weight:700;color:var(--text-muted)">PAGAMENTO</span>
            <button class="btn btn-ghost btn-sm" onclick="addPagamentoRow()">+ Dividir pagamento</button>
          </div>
          <div id="pagamento-rows"></div>
          <div id="pagamento-restante" class="text-xs mt-1"></div>
          <div id="desconto-section" class="mt-2">
            <div class="flex gap-2 items-center">
              <input type="number" id="desconto-input" placeholder="Desconto R$" min="0" style="flex:1" oninput="updateCartTotal()">
              <input type="number" id="parcelas-input" placeholder="Parcelas" min="1" max="12" value="1" style="width:90px">
            </div>
          </div>
        </div>

        <div class="cart-actions">
          <button class="btn btn-success w-full" id="btn-finalizar-venda" style="justify-content:center;padding:14px;font-size:16px" onclick="finalizarVenda()">
            ✅ Finalizar Venda
          </button>
        </div>
      </div>
    </div>
  `);
  renderPDVGrid();
  updateCartDisplay();
}

// ---- Leitor de código de barras ----
async function handleBarcodeEnter(event) {
  if (event.key !== 'Enter') return;
  event.preventDefault();
  const input = document.getElementById('pdv-barcode');
  const codigo = (input.value || '').trim();
  if (!codigo) return;

  try {
    const r = await api('GET', `/api/produtos/buscar-codigo/${encodeURIComponent(codigo)}`);
    const prodLike = { id: r.produto_id, nome: r.nome, preco_venda: r.preco_venda };
    const variacaoLike = { id: r.variacao_id, tamanho: r.tamanho, cor: r.cor, estoque: r.estoque };
    addItemToCart(prodLike, variacaoLike);
  } catch (e) {
    toast('Código não encontrado', 'error');
  } finally {
    input.value = '';
    input.focus();
  }
}

function pdvSetCat(id) {
  STATE.pdvCatFilter = id === 'null' ? null : id;
  document.querySelectorAll('.pdv-cat-btn').forEach((b, i) => {
    b.classList.toggle('active', (i === 0 && STATE.pdvCatFilter === null) || b.textContent === STATE.categorias.find(c => c.id === STATE.pdvCatFilter)?.nome);
  });
  renderPDVGrid();
}

function renderPDVGrid() {
  const q = (document.getElementById('pdv-search')?.value || '').toLowerCase();
  let prods = STATE.produtos.filter(p => p.ativo);
  if (STATE.pdvCatFilter) prods = prods.filter(p => p.categoria_id === STATE.pdvCatFilter);
  if (q) prods = prods.filter(p => p.nome.toLowerCase().includes(q));

  const icons = { feminino:'👗', masculino:'👔', infantil:'👶', unissex:'🧢', default:'🏷️' };

  document.getElementById('pdv-grid').innerHTML = prods.length === 0 ?
    '<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">😔</div><p>Nenhum produto</p></div>' :
    prods.map(p => {
      const totalEstoque = (p.variacoes||[]).reduce((s, v) => s + (v.estoque||0), 0);
      const icon = icons[p.genero] || icons.default;
      return `
        <div class="pdv-product-card" onclick="addToCart('${p.id}')">
          <div class="prod-icon">${icon}</div>
          <div class="prod-name">${p.nome}</div>
          <div class="prod-price">R$ ${p.preco_venda.toFixed(2).replace('.',',')}</div>
          <div class="prod-stock">${totalEstoque} em estoque</div>
        </div>`;
    }).join('');
}

function addToCart(prodId) {
  const prod = STATE.produtos.find(p => p.id === prodId);
  if (!prod) return;

  if (prod.variacoes && prod.variacoes.length > 1) {
    openVariacaoModal(prod);
    return;
  }

  const variacao = prod.variacoes?.[0];
  addItemToCart(prod, variacao);
}

function openVariacaoModal(prod) {
  const variacoes = prod.variacoes.filter(v => v.estoque > 0);
  if (variacoes.length === 0) return toast('Produto sem estoque!', 'error');

  openModal(`Selecionar ${prod.nome}`, `
    <p style="margin-bottom:16px;color:var(--text-muted)">Escolha o tamanho e cor:</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px">
      ${variacoes.map(v => `
        <button onclick="selectVariacao('${prod.id}','${v.id}');closeModal()"
          class="btn btn-outline" style="flex-direction:column;padding:14px;gap:4px;border-radius:10px">
          <span style="font-size:18px;font-weight:800">${v.tamanho}</span>
          <span style="font-size:12px;color:var(--text-muted)">${v.cor}</span>
          <span style="font-size:11px;color:var(--success)">${v.estoque} und</span>
        </button>`).join('')}
    </div>
  `, '', 'modal-md');
}

function selectVariacao(prodId, varId) {
  const prod = STATE.produtos.find(p => p.id === prodId);
  const variacao = prod?.variacoes?.find(v => v.id === varId);
  if (prod && variacao) addItemToCart(prod, variacao);
}

function addItemToCart(prod, variacao) {
  const key = prod.id + (variacao?.id || '');
  const existing = STATE.cart.find(i => i.key === key);
  const maxEstoque = variacao?.estoque || 99;

  if (existing) {
    if (existing.quantidade >= maxEstoque) return toast('Estoque insuficiente!', 'error');
    existing.quantidade++;
  } else {
    STATE.cart.push({
      key, produto_id: prod.id, variacao_id: variacao?.id,
      nome_produto: prod.nome, tamanho: variacao?.tamanho, cor: variacao?.cor,
      preco_unitario: prod.preco_venda, quantidade: 1,
      desconto: 0, subtotal: prod.preco_venda
    });
  }
  toast(`${prod.nome} adicionado ✓`, 'success');
  updateCartDisplay();
}

function removeFromCart(key) {
  STATE.cart = STATE.cart.filter(i => i.key !== key);
  updateCartDisplay();
}

function changeQty(key, delta) {
  const item = STATE.cart.find(i => i.key === key);
  if (!item) return;
  item.quantidade = Math.max(1, item.quantidade + delta);
  item.subtotal = item.preco_unitario * item.quantidade - (item.desconto || 0);
  updateCartDisplay();
}

function clearCart() {
  STATE.cart = [];
  STATE.cartCliente = null;
  STATE.cartClienteSaldo = 0;
  STATE.cartDesconto = 0;
  STATE.cartPagamentos = [{ forma_pagamento: 'dinheiro', valor: 0 }];
  updateCartDisplay();
  const sel = document.getElementById('cart-cliente');
  if (sel) sel.value = '';
  const desc = document.getElementById('desconto-input');
  if (desc) desc.value = '';
}

// ---- Cliente selecionado: carrega saldo de crédito disponível ----
function setCartCliente(id) {
  STATE.cartCliente = id || null;
  const cliente = STATE.clientes.find(c => c.id === id);
  STATE.cartClienteSaldo = cliente?.saldo_credito || 0;

  // Se não tem mais cliente, nenhuma linha pode ficar usando crédito de loja
  if (!id) {
    STATE.cartPagamentos.forEach(p => { if (p.forma_pagamento === 'credito_loja') p.forma_pagamento = 'dinheiro'; });
  }
  renderPagamentoRows();
}

// ---- Cadastro rápido de cliente, direto na venda (nome + telefone) ----
function modalClienteRapido() {
  openModal('👤 Novo Cliente Rápido', `
    <p class="text-xs text-muted mb-3">Só nome e telefone já ajuda bastante — dá pra completar o cadastro depois em Clientes. O telefone também facilita achar essa venda numa troca futura.</p>
    <div class="form-group"><label>Nome *</label><input type="text" id="cli-rapido-nome" placeholder="Nome do cliente" autofocus></div>
    <div class="form-group"><label>Telefone</label><input type="text" id="cli-rapido-tel" placeholder="(11) 99999-9999"></div>
  `, `
    <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="confirmarClienteRapido()">Cadastrar e usar</button>
  `, 'modal-sm');
}

async function confirmarClienteRapido() {
  const nome = (document.getElementById('cli-rapido-nome').value || '').trim();
  const telefone = (document.getElementById('cli-rapido-tel').value || '').trim();
  if (!nome) return toast('Digite o nome do cliente', 'error');

  try {
    const novoCliente = await api('POST', '/api/clientes', { nome, telefone: telefone || null });
    STATE.clientes.push(novoCliente);
    closeModal();
    toast(`${nome} cadastrado!`, 'success');

    // Já seleciona esse cliente no PDV, se a tela estiver aberta
    const sel = document.getElementById('cart-cliente');
    if (sel) {
      const opt = document.createElement('option');
      opt.value = novoCliente.id;
      opt.textContent = novoCliente.nome;
      sel.appendChild(opt);
      sel.value = novoCliente.id;
      setCartCliente(novoCliente.id);
    }
  } catch (e) {
    toast('Erro: ' + e.message, 'error');
  }
}

// ---- Pagamento dividido ----
function getCartTotal() {
  const subtotal = STATE.cart.reduce((s, i) => s + i.preco_unitario * i.quantidade, 0);
  const desconto = STATE.cartDesconto || 0;
  return Math.max(0, subtotal - desconto);
}

function addPagamentoRow() {
  const total = getCartTotal();
  const jaAlocado = STATE.cartPagamentos.reduce((s, p) => s + (Number(p.valor) || 0), 0);
  const restante = Math.max(0, total - jaAlocado);
  STATE.cartPagamentos.push({ forma_pagamento: 'pix', valor: restante });
  renderPagamentoRows();
}

function removePagamentoRow(idx) {
  STATE.cartPagamentos.splice(idx, 1);
  if (STATE.cartPagamentos.length === 0) {
    STATE.cartPagamentos.push({ forma_pagamento: 'dinheiro', valor: getCartTotal() });
  }
  renderPagamentoRows();
}

function setPagamentoForma(idx, forma) {
  if (forma === 'credito_loja' && !STATE.cartCliente) {
    toast('Selecione um cliente para usar crédito de loja', 'error');
    renderPagamentoRows();
    return;
  }
  STATE.cartPagamentos[idx].forma_pagamento = forma;
  renderPagamentoRows();
}

function setPagamentoValor(idx, valor) {
  STATE.cartPagamentos[idx].valor = parseFloat(valor) || 0;
  atualizarRestanteDisplay();
}

function atualizarRestanteDisplay() {
  const total = getCartTotal();
  const alocado = STATE.cartPagamentos.reduce((s, p) => s + (Number(p.valor) || 0), 0);
  const restante = total - alocado;
  const el = document.getElementById('pagamento-restante');
  const btn = document.getElementById('btn-finalizar-venda');
  if (!el) return;

  if (Math.abs(restante) < 0.01) {
    el.innerHTML = `<span style="color:var(--success);font-weight:600">✓ Pagamento completo</span>`;
    if (btn) btn.disabled = false;
  } else if (restante > 0) {
    el.innerHTML = `<span style="color:var(--warning);font-weight:600">Faltam R$ ${restante.toFixed(2).replace('.',',')}</span>`;
    if (btn) btn.disabled = true;
  } else {
    el.innerHTML = `<span style="color:var(--danger);font-weight:600">R$ ${Math.abs(restante).toFixed(2).replace('.',',')} acima do total</span>`;
    if (btn) btn.disabled = true;
  }
}

function renderPagamentoRows() {
  const total = getCartTotal();
  // Se só tem uma forma de pagamento, mantém ela sincronizada com o total
  // automaticamente — só quando o usuário divide manualmente é que os
  // valores passam a ser editados um a um.
  if (STATE.cartPagamentos.length === 1) {
    STATE.cartPagamentos[0].valor = total;
  }

  const container = document.getElementById('pagamento-rows');
  if (!container) return;

  container.innerHTML = STATE.cartPagamentos.map((row, idx) => `
    <div class="mb-2">
      <div class="flex gap-2 items-center">
        <select onchange="setPagamentoForma(${idx}, this.value)" style="flex:1.3;font-size:13px;padding:7px 8px;border-radius:8px;border:1.5px solid var(--border)">
          ${Object.keys(PAGAMENTO_LABELS).map(p => `<option value="${p}" ${row.forma_pagamento===p?'selected':''}>${PAGAMENTO_ICONS[p]} ${PAGAMENTO_LABELS[p]}</option>`).join('')}
        </select>
        <input type="number" value="${row.valor.toFixed(2)}" min="0" step="0.01"
          style="width:110px;font-size:13px;padding:7px 8px;border-radius:8px;border:1.5px solid var(--border)"
          oninput="setPagamentoValor(${idx}, this.value)">
        ${STATE.cartPagamentos.length > 1 ? `<button onclick="removePagamentoRow(${idx})" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:16px">✕</button>` : ''}
      </div>
      ${row.forma_pagamento === 'credito_loja' ? `
        <div class="text-xs" style="margin:4px 0 0 2px;color:${STATE.cartClienteSaldo >= row.valor ? 'var(--text-muted)' : 'var(--danger)'}">
          Saldo disponível: R$ ${(STATE.cartClienteSaldo||0).toFixed(2).replace('.',',')}
        </div>` : ''}
    </div>
  `).join('');

  atualizarRestanteDisplay();
}

function updateCartTotal() {
  const desconto = parseFloat(document.getElementById('desconto-input')?.value || 0);
  STATE.cartDesconto = desconto;
  updateCartDisplay();
}

function updateCartDisplay() {
  const items = document.getElementById('cart-items');
  const totalEl = document.getElementById('cart-total');
  if (!items || !totalEl) return;

  if (STATE.cart.length === 0) {
    items.innerHTML = `<div class="empty-state" style="padding:24px"><div class="empty-icon" style="font-size:40px">🛍️</div><p class="empty-text">Adicione produtos ao carrinho</p></div>`;
    totalEl.innerHTML = '';
    renderPagamentoRows();
    return;
  }

  items.innerHTML = STATE.cart.map(item => `
    <div class="cart-item">
      <div class="cart-item-info">
        <div class="cart-item-name">${item.nome_produto}</div>
        <div class="cart-item-detail">${[item.tamanho, item.cor].filter(Boolean).join(' • ')} | R$ ${item.preco_unitario.toFixed(2).replace('.',',')}</div>
      </div>
      <div class="qty-control">
        <button class="qty-btn" onclick="changeQty('${item.key}',-1)">−</button>
        <span class="qty-num">${item.quantidade}</span>
        <button class="qty-btn" onclick="changeQty('${item.key}',1)">+</button>
      </div>
      <div style="min-width:72px;text-align:right">
        <div class="font-bold" style="font-size:14px">R$ ${(item.preco_unitario * item.quantidade).toFixed(2).replace('.',',')}</div>
        <button onclick="removeFromCart('${item.key}')" style="font-size:11px;color:var(--danger);background:none;border:none;cursor:pointer">remover</button>
      </div>
    </div>`).join('');

  const subtotal = STATE.cart.reduce((s, i) => s + i.preco_unitario * i.quantidade, 0);
  const desconto = STATE.cartDesconto || 0;
  const total = subtotal - desconto;

  totalEl.innerHTML = `
    <div class="total-row"><span>Subtotal</span><span>R$ ${subtotal.toFixed(2).replace('.',',')}</span></div>
    ${desconto > 0 ? `<div class="total-row" style="color:var(--success)"><span>Desconto</span><span>−R$ ${desconto.toFixed(2).replace('.',',')}</span></div>` : ''}
    <div class="total-row big"><span>TOTAL</span><span>R$ ${Math.max(0, total).toFixed(2).replace('.',',')}</span></div>
  `;

  renderPagamentoRows();
}

async function finalizarVenda() {
  if (STATE.cart.length === 0) return toast('Carrinho vazio!', 'error');

  const total = getCartTotal();
  const pagamentos = STATE.cartPagamentos
    .filter(p => p.valor > 0)
    .map(p => ({ forma_pagamento: p.forma_pagamento, valor: Number(p.valor) }));

  const somaPagamentos = pagamentos.reduce((s, p) => s + p.valor, 0);
  if (Math.abs(somaPagamentos - total) > 0.01) {
    return toast('A soma dos pagamentos precisa bater com o total da venda', 'error');
  }

  // Checagem client-side do saldo de crédito (o backend valida de novo, isso é só UX)
  const usaCredito = pagamentos.find(p => p.forma_pagamento === 'credito_loja');
  if (usaCredito && usaCredito.valor > STATE.cartClienteSaldo) {
    return toast('Saldo de crédito insuficiente', 'error');
  }

  const desconto_valor = STATE.cartDesconto || 0;
  const subtotal = STATE.cart.reduce((s, i) => s + i.preco_unitario * i.quantidade, 0);
  const parcelas = parseInt(document.getElementById('parcelas-input')?.value || 1);
  const cliente_id = document.getElementById('cart-cliente')?.value || null;
  const funcionario_id = document.getElementById('cart-func')?.value || null;

  try {
    const venda = await api('POST', '/api/vendas', {
      itens: STATE.cart.map(i => ({ produto_id: i.produto_id, variacao_id: i.variacao_id, nome_produto: i.nome_produto, tamanho: i.tamanho, cor: i.cor, quantidade: i.quantidade, preco_unitario: i.preco_unitario, desconto: 0, subtotal: i.preco_unitario * i.quantidade })),
      cliente_id, funcionario_id, pagamentos,
      parcelas, desconto_valor, subtotal, total
    });

    toast(`✅ Venda ${venda.numero} finalizada! Total: R$ ${total.toFixed(2).replace('.',',')}`, 'success');
    openRecibo(venda, total, pagamentos, cliente_id);
    clearCart();
  } catch (e) {
    toast('Erro ao finalizar venda: ' + e.message, 'error');
  }
}

// ---- WhatsApp via link wa.me — sem API, sem cadastro, sem custo ----
// Abre o WhatsApp (app ou web) já com o número e a mensagem prontos;
// quem manda ainda precisa clicar em "Enviar" do outro lado.
function telefoneParaWhatsapp(telefone) {
  if (!telefone) return null;
  let digitos = String(telefone).replace(/\D/g, '');
  if (!digitos) return null;
  if (digitos.length <= 11) digitos = '55' + digitos; // assume Brasil se não tiver código do país
  return digitos;
}

function abrirWhatsapp(telefone, mensagem) {
  const numero = telefoneParaWhatsapp(telefone);
  if (!numero) return toast('Esse cliente não tem telefone cadastrado', 'error');
  window.open(`https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`, '_blank');
}

function openRecibo(venda, total, pagamentos, clienteId) {
  const cliente = STATE.clientes.find(c => c.id === clienteId);
  const linhasPagamento = (pagamentos || []).map(p => `

  `).join('');

  const nomeLoja = STATE.loja?.nome || 'nossa loja';
  const resumoPagamento = (pagamentos || []).map(p => `${PAGAMENTO_LABELS[p.forma_pagamento]||p.forma_pagamento}: R$ ${p.valor.toFixed(2).replace('.',',')}`).join(', ');
  const mensagemWhats = `Olá${cliente ? ' ' + cliente.nome.split(' ')[0] : ''}! 🛍️ Aqui está o comprovante da sua compra na ${nomeLoja}:\n\n🧾 Venda ${venda.numero}\n💳 ${resumoPagamento}\n💰 Total: R$ ${total.toFixed(2).replace('.',',')}\n\nObrigado pela compra! 💜`;

  openModal('🧾 Comprovante de Venda', `
    <div style="text-align:center;padding:8px 0 20px">
      <div style="font-size:48px">✅</div>
      <h2 style="font-size:22px;font-weight:800;color:var(--success);margin:8px 0">Venda Aprovada!</h2>
      <p style="color:var(--text-muted)">${venda.numero || 'Nova venda'}</p>
    </div>
    <div style="background:var(--bg);border-radius:10px;padding:16px">
      ${cliente ? `<div class="total-row"><span>Cliente</span><span class="font-bold">${cliente.nome}</span></div>` : ''}
      ${linhasPagamento}
      <div style="border-top:2px dashed var(--border);margin:12px 0"></div>
      <div class="total-row big"><span>Total</span><span>R$ ${total.toFixed(2).replace('.',',')}</span></div>
    </div>
  `, `
    ${cliente?.telefone ? `<button class="btn btn-success" onclick='abrirWhatsapp(${JSON.stringify(cliente.telefone)}, ${JSON.stringify(mensagemWhats)})'>📱 Enviar por WhatsApp</button>` : ''}

function renderTabelaProdutos(prods) {
  if (prods.length === 0) return `<div class="empty-state"><div class="empty-icon">👗</div><p class="empty-title">Nenhum produto</p><button class="btn btn-primary" onclick="openProdutoModal()">+ Adicionar Produto</button></div>`;
  return `
    <table>
      <thead><tr><th>Produto</th><th>Categoria</th><th>Marca</th><th>Preço</th><th>Custo</th><th>Estoque</th><th>Ações</th></tr></thead>
      <tbody>
        ${prods.map(p => {
          const totalEst = (p.variacoes||[]).reduce((s,v) => s+(v.estoque||0), 0);
          const margem = p.preco_custo > 0 ? (((p.preco_venda - p.preco_custo) / p.preco_custo) * 100).toFixed(0) : '—';
          return `<tr>
            <td>
              <div class="font-bold">${p.nome}</div>
              <div class="text-xs text-muted">${p.genero}</div>
            </td>
            <td><span class="badge badge-purple">${p.categorias?.nome||'—'}</span></td>
            <td class="text-sm text-muted">${p.marca||'—'}</td>
            <td class="font-bold">R$ ${p.preco_venda.toFixed(2).replace('.',',')}</td>
            <td class="text-sm text-muted">R$ ${(p.preco_custo||0).toFixed(2).replace('.',',')} <span style="font-size:10px;color:var(--success)">(${margem}%)</span></td>
            <td>
              <span class="badge ${totalEst === 0 ? 'badge-red' : totalEst <= 5 ? 'badge-yellow' : 'badge-green'}">${totalEst} un.</span>
            </td>
            <td>
              <div class="flex gap-1">
                <button class="btn btn-outline btn-sm" onclick="editarProduto('${p.id}')">✏️ Editar</button>
                <button class="btn btn-ghost btn-sm" onclick="verVariacoes('${p.id}')">📦 Estoque</button>
              </div>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

function filtrarProdutos(search) {
  const q = (search || document.getElementById('prod-search')?.value || '').toLowerCase();
  const cat = document.getElementById('filtro-cat')?.value;
  let prods = STATE.produtos.filter(p => p.ativo !== false);
  if (q) prods = prods.filter(p => p.nome.toLowerCase().includes(q) || (p.marca||'').toLowerCase().includes(q));
  if (cat) prods = prods.filter(p => p.categoria_id === cat);
  document.getElementById('tabela-produtos').innerHTML = renderTabelaProdutos(prods);
}

function variacaoRowHtml(v, i) {
  return `<div class="variacao-row" id="var-row-${i}" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:10px;border-radius:8px;margin-bottom:6px">

function addVariacaoRow() {
  const i = STATE._variacaoCount++;
  document.getElementById('variacoes-list').insertAdjacentHTML('beforeend', variacaoRowHtml({}, i));
}

function removeVariacaoRow(i) {
  document.getElementById('var-row-' + i)?.remove();
}

async function salvarProduto(id) {
  const nome = (document.getElementById('prod-nome').value || '').trim();
  const preco_venda = parseFloat(document.getElementById('prod-preco').value || 0);
  if (!nome) return toast('Nome do produto é obrigatório', 'error');
  if (!preco_venda || preco_venda <= 0) return toast('Preço de venda é obrigatório', 'error');

  // Coleta variações do grid
  const variacoes = [];
  document.querySelectorAll('[id^="var-row-"]').forEach(row => {
    const idx = row.id.replace('var-row-', '');
    variacoes.push({
      tamanho: (document.getElementById('var-tam-' + idx)?.value || '').trim() || null,
      cor: (document.getElementById('var-cor-' + idx)?.value || '').trim() || null,
      estoque: parseInt(document.getElementById('var-est-' + idx)?.value || 0),
      estoque_minimo: parseInt(document.getElementById('var-min-' + idx)?.value || 5),
      codigo_barras: (document.getElementById('var-cod-' + idx)?.value || '').trim() || null
    });
  });

  const dados = {
    nome,
    marca: (document.getElementById('prod-marca').value || '').trim() || null,
    categoria_id: document.getElementById('prod-cat').value || null,
    genero: document.getElementById('prod-genero').value || 'feminino',
    preco_venda,
    preco_custo: parseFloat(document.getElementById('prod-custo').value || 0),
    descricao: (document.getElementById('prod-desc').value || '').trim() || null,
    variacoes
  };

  const btn = document.querySelector('#modal-footer .btn-primary');
  if (btn) { btn.textContent = 'Salvando...'; btn.disabled = true; }

  try {
    if (id) {
      await api('PUT', '/api/produtos/' + id, dados);
      toast('Produto atualizado!', 'success');
    } else {
      await api('POST', '/api/produtos', dados);
      toast('Produto criado!', 'success');
    }
    closeModal();
    await renderProdutos();
  } catch(e) {
    toast('Erro: ' + e.message, 'error');
  } finally {
    if (btn) { btn.textContent = '💾 Salvar'; btn.disabled = false; }
  }
}

async function renderEstoque() {

        <div><div class="stat-label">Estoque crítico</div><div class="stat-value">${critico.filter(v=>v.estoque>0).length}</div></div>

      <div class="stat-card">
        <div class="stat-icon" style="background:#fee2e2">❌</div>
        <div><div class="stat-label">Esgotados</div><div class="stat-value">${critico.filter(v=>v.estoque===0).length}</div></div>
      </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">Controle de Estoque</span>
        <div class="flex gap-2">
          <button class="btn btn-outline btn-sm" onclick="renderEstoque()">🔄 Atualizar</button>
          <button class="btn btn-primary" onclick="navigate('produtos')">+ Novo Produto</button>
        </div>
      </div>
      <div class="tabs">
        <button class="tab-btn active" onclick="filterEstoque('todos',this)">Todos (${todasVar.length})</button>

function renderEstoqueTabela(items) {
  return `<table>
    <thead><tr><th>Produto</th><th>Categoria</th><th>Tam.</th><th>Cor</th><th>Estoque</th><th>Mínimo</th><th>Status</th><th>Ação</th></tr></thead>
    <tbody>
      ${items.map(v => `<tr>
        <td class="font-bold">${v.produto.nome}</td>
        <td><span class="badge badge-purple">${v.produto.categorias?.nome||'—'}</span></td>
        <td>${v.tamanho||'—'}</td>
        <td>${v.cor||'—'}</td>
        <td class="font-bold">${v.estoque}</td>
        <td class="text-muted">${v.estoque_minimo}</td>
        <td><span class="badge ${v.estoque===0?'badge-red':v.estoque<=v.estoque_minimo?'badge-yellow':'badge-green'}">${v.estoque===0?'Esgotado':v.estoque<=v.estoque_minimo?'Baixo':'Normal'}</span></td>
        <td><button class="btn btn-outline btn-sm" onclick="ajustarEstoque('${v.produto.id}','${v.id}',${v.estoque})">Ajustar</button></td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

function filterEstoque(tipo, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const todasVar = STATE.produtos.flatMap(p => (p.variacoes||[]).map(v => ({ ...v, produto: p })));
  let items = todasVar;
  if (tipo === 'critico') items = todasVar.filter(v => v.estoque <= v.estoque_minimo);
  if (tipo === 'ok') items = todasVar.filter(v => v.estoque > v.estoque_minimo);
  document.getElementById('estoque-tabela').innerHTML = renderEstoqueTabela(items);
}

function ajustarEstoque(prodId, varId, atual) {
  openModal('Ajustar Estoque', `
    <div class="form-group">
      <label>Estoque atual: <strong>${atual}</strong></label>
      <input type="number" id="novo-estoque" value="${atual}" min="0" style="margin-top:8px">
    </div>
    <div class="form-group">
      <label>Motivo do ajuste</label>
      <select id="motivo-ajuste">
        <option>Inventário</option><option>Entrada de mercadoria</option>
        <option>Avaria/Perda</option><option>Devolução</option><option>Outro</option>
      </select>
    </div>
  `, `
    <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="confirmarAjuste('${prodId}','${varId}')">Confirmar</button>
  `);
}

async function confirmarAjuste(prodId, varId) {
  const novoEst = parseInt(document.getElementById('novo-estoque').value);
  const motivo = document.getElementById('motivo-ajuste').value;
  const prod = STATE.produtos.find(p => p.id === prodId);
  if (!prod) return;

  // O backend substitui todas as variações do produto de uma vez só —
  // então mandamos a lista inteira, só trocando o estoque da que foi ajustada.
  const variacoesAtualizadas = (prod.variacoes || []).map(v => ({
    tamanho: v.tamanho, cor: v.cor,
    estoque: v.id === varId ? novoEst : v.estoque,
    estoque_minimo: v.estoque_minimo,
    codigo_barras: v.codigo_barras
  }));

  try {
    await api('PUT', `/api/produtos/${prodId}`, { variacoes: variacoesAtualizadas });
    closeModal();
    toast(`Estoque atualizado! (${motivo})`, 'success');
    renderEstoque();
  } catch (e) {
    toast('Erro: ' + e.message, 'error');
  }
}

  loading();
  try {
    const d = await api('GET', '/api/clientes?limit=500');
    STATE.clientes = d?.data || (Array.isArray(d) ? d : []);
  } catch(e) {
    setContent(`<div class="empty-state"><div class="empty-icon">⚠️</div><p class="empty-title">Erro</p><p>${e.message}</p><button class="btn btn-primary" onclick="renderClientes()">Tentar novamente</button></div>`);
    return;
  }
  const cs = STATE.clientes.filter(c => c.ativo !== false);
  setContent(`
    <div class="card">
      <div class="card-header">
        <div class="search-bar" style="max-width:300px">
          <span>🔍</span><input type="text" placeholder="Buscar clientes..." oninput="filtrarClientes(this.value)">
        </div>
        <button class="btn btn-primary" onclick="openClienteModal()">+ Novo Cliente</button>
      </div>
      <div class="table-wrap" id="tabela-clientes">
        ${renderTabelaClientes(cs)}
      </div>
    </div>
  `);
}

function renderTabelaClientes(clientes) {
  if (clientes.length === 0) return `<div class="empty-state"><div class="empty-icon">👥</div><p class="empty-title">Nenhum cliente</p><button class="btn btn-primary" onclick="openClienteModal()">+ Adicionar</button></div>`;
  const fmtR = v => `R$ ${(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}`;
  return `
    <table>
      <thead><tr><th>Cliente</th><th>Telefone</th><th>Total Compras</th><th>Nº Compras</th><th>Pontos</th><th>Última Compra</th><th>Ações</th></tr></thead>
      <tbody>
        ${clientes.map(c => `<tr>
          <td>
            <div class="font-bold">${c.nome}</div>
            <div class="text-xs text-muted">${c.email||'—'}</div>
          </td>
          <td>${c.telefone||'—'}</td>
          <td class="font-bold">${fmtR(c.total_compras)}</td>
          <td><span class="badge badge-blue">${c.num_compras}</span></td>
          <td><span class="tag">⭐ ${c.pontos}</span></td>
          <td class="text-sm text-muted">${c.ultima_compra ? new Date(c.ultima_compra).toLocaleDateString('pt-BR') : '—'}</td>
          <td>
            <div class="flex gap-1">
              <button class="btn btn-outline btn-sm" onclick="verCliente('${c.id}')">Ver</button>
              <button class="btn btn-ghost btn-sm" onclick="openClienteModal('${c.id}')">✏️</button>
            </div>
          </td>
        </tr>`).join('')}
      </tbody>
    </table>`;
}

function filtrarClientes(q) {
  const clientes = STATE.clientes.filter(c => c.ativo && (c.nome.toLowerCase().includes(q.toLowerCase()) || (c.telefone||'').includes(q)));
  document.getElementById('tabela-clientes').innerHTML = renderTabelaClientes(clientes);
}

function openClienteModal(id) {
  const c = id ? STATE.clientes.find(x => x.id === id) : null;
  openModal(c ? 'Editar Cliente' : 'Novo Cliente', `
    <div class="form-row">
      <div class="form-group"><label>Nome *</label><input type="text" id="cli-nome" value="${c?.nome||''}"></div>
      <div class="form-group"><label>CPF</label><input type="text" id="cli-cpf" value="${c?.cpf||''}" placeholder="000.000.000-00"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Email</label><input type="email" id="cli-email" value="${c?.email||''}"></div>
      <div class="form-group"><label>Telefone</label><input type="text" id="cli-tel" value="${c?.telefone||''}" placeholder="(11) 99999-9999"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Data de Nascimento</label><input type="date" id="cli-nasc" value="${c?.data_nascimento||''}"></div>
      <div class="form-group"><label>Gênero</label><select id="cli-genero">
        <option value="">Selecionar</option>
        <option value="feminino" ${c?.genero==='feminino'?'selected':''}>Feminino</option>
        <option value="masculino" ${c?.genero==='masculino'?'selected':''}>Masculino</option>
        <option value="outro" ${c?.genero==='outro'?'selected':''}>Outro</option>
      </select></div>
    </div>
    <div class="form-group"><label>Observações</label><textarea id="cli-obs" rows="2">${c?.observacoes||''}</textarea></div>
  `, `
    <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="salvarCliente('${id||''}')">💾 Salvar</button>
  `);
}

async function salvarCliente(id) {
  const nome = (document.getElementById('cli-nome').value || '').trim();
  if (!nome) return toast('Nome obrigatório', 'error');
  const dados = {
    nome,
    cpf: document.getElementById('cli-cpf')?.value || null,
    email: document.getElementById('cli-email')?.value || null,
    telefone: document.getElementById('cli-tel')?.value || null,
    data_nascimento: document.getElementById('cli-nasc')?.value || null,
    genero: document.getElementById('cli-genero')?.value || null,
    observacoes: document.getElementById('cli-obs')?.value || null
  };
  try {
    if (id) { await api('PUT', '/api/clientes/' + id, dados); toast('Cliente atualizado!', 'success'); }
    else { await api('POST', '/api/clientes', dados); toast('Cliente cadastrado!', 'success'); }
    closeModal();
    await renderClientes();
  } catch(e) { toast('Erro: ' + e.message, 'error'); }
}

      </div>
      <div style="background:var(--bg);padding:16px;border-radius:10px">
        <div class="text-xs text-muted mb-1">Crédito de Loja</div>

      <div><span class="text-xs text-muted">Email</span><p class="font-bold">${c.email||'—'}</p></div>
      <div><span class="text-xs text-muted">Telefone</span><p class="font-bold">${c.telefone||'—'}</p></div>

      <td>${pagBadge(v.forma_pagamento)}</td>
      <td class="text-sm text-muted">${new Date(v.criado_em).toLocaleDateString('pt-BR')}</td>
    </tr>`).join('')}</tbody></table>`}
