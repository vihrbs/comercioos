    <button class="btn btn-primary" onclick="closeModal()">Fechar</button>
  `, 'modal-md');
}

async function verHistoricoCredito(id) {
  const c = STATE.clientes.find(x => x.id === id);
  const fmtR = v => `R$ ${(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}`;
  const origemLabel = { troca: '🔄 Troca', venda: '🛒 Uso em venda', ajuste_manual: '⚙️ Ajuste manual' };

  openModal(`🎁 Histórico de Crédito — ${c.nome}`, '<p class="text-sm text-muted">Carregando...</p>', '', 'modal-md');

  try {
    const r = await api('GET', `/api/clientes/${id}/credito`);
    document.getElementById('modal-body').innerHTML = `
      <div style="background:var(--bg);padding:14px;border-radius:10px;margin-bottom:14px;text-align:center">
        <div class="text-xs text-muted">Saldo atual</div>
        <div style="font-size:26px;font-weight:800;color:var(--success)">${fmtR(r.saldo_atual)}</div>
      </div>
      ${r.historico.length === 0 ? '<p class="text-sm text-muted">Sem movimentações ainda</p>' : `
        <table>
          <thead><tr><th>Data</th><th>Tipo</th><th>Origem</th><th>Valor</th><th>Saldo após</th></tr></thead>
          <tbody>
            ${r.historico.map(h => `
              <tr>
                <td class="text-sm text-muted">${new Date(h.criado_em).toLocaleDateString('pt-BR')}</td>
                <td><span class="badge ${h.tipo==='credito'?'badge-green':'badge-red'}">${h.tipo==='credito'?'+ Entrou':'− Usado'}</span></td>
                <td class="text-sm">${origemLabel[h.origem]||h.origem||'—'}</td>
                <td class="font-bold" style="color:${h.tipo==='credito'?'var(--success)':'var(--danger)'}">${h.tipo==='credito'?'+':'−'}${fmtR(h.valor)}</td>
                <td class="text-sm text-muted">${fmtR(h.saldo_apos)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `}
    `;
    document.getElementById('modal-footer').innerHTML = `
      <button class="btn btn-outline" onclick="verCliente('${id}')">Voltar</button>
      <button class="btn btn-primary" onclick="closeModal()">Fechar</button>
    `;
  } catch (e) {
    document.getElementById('modal-body').innerHTML = `<p style="color:var(--danger)">${e.message}</p>`;
  }
}

function modalAjustarCredito(id, saldoAtual) {
  const fmtR = v => `R$ ${(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}`;
  openModal('⚙️ Ajustar Saldo de Crédito', `
    <p class="text-sm text-muted mb-3">Saldo atual: <strong>${fmtR(saldoAtual)}</strong></p>
    <div class="form-group">
      <label>Valor do ajuste (use negativo pra reduzir, ex: -20)</label>
      <input type="number" id="ajuste-credito-valor" step="0.01" placeholder="Ex: 50 ou -20">
    </div>
    <div class="form-group">
      <label>Motivo</label>
      <input type="text" id="ajuste-credito-motivo" placeholder="Ex: cortesia, correção de erro...">
    </div>
  `, `
    <button class="btn btn-outline" onclick="verCliente('${id}')">Cancelar</button>
    <button class="btn btn-primary" onclick="confirmarAjusteCredito('${id}')">Confirmar</button>
  `, 'modal-sm');
}

async function confirmarAjusteCredito(id) {
  const valor = parseFloat(document.getElementById('ajuste-credito-valor').value || 0);
  const motivo = document.getElementById('ajuste-credito-motivo').value;
  if (!valor) return toast('Informe um valor diferente de zero', 'error');

  try {
    const r = await api('POST', `/api/clientes/${id}/credito/ajustar`, { valor, motivo });
    const cliente = STATE.clientes.find(c => c.id === id);
    if (cliente) cliente.saldo_credito = r.novo_saldo;
    toast('Saldo ajustado!', 'success');
    verCliente(id);
  } catch (e) {
    toast('Erro: ' + e.message, 'error');
  }
}

  const nomeLoja = STATE.loja?.nome || 'nossa loja';

  const mensagem = `Olá${nomeCliente ? ' ' + nomeCliente : ''}! 🛍️ Aqui está o comprovante da sua compra na ${nomeLoja}:\n\n🧾 Venda ${v.numero}\n💳 ${label}\n💰 Total: R$ ${fmtR(v.total)}\n\nObrigado pela compra! 💜`;

// Comanda de venda — funciona de qualquer tela (Dashboard, Vendas, Clientes,
// Trocas), sempre busca fresco da API, mostra os itens e a data/hora exatas.
async function verVenda(id) {
  const fmtR = val => `R$ ${(val||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}`;
  openModal('🧾 Comanda', '<div style="text-align:center;padding:24px"><div class="spinner"></div></div>', '', 'modal-md');

  let v;
  try {
    v = await api('GET', `/api/vendas/${id}`);
  } catch (e) {
    document.getElementById('modal-body').innerHTML = `<p style="color:var(--danger)">${e.message}</p>`;
    return;
  }

  const dataHora = new Date(v.criado_em);
  const pagamentos = (v.venda_pagamentos && v.venda_pagamentos.length > 0)
    ? v.venda_pagamentos
    : [{ forma_pagamento: v.forma_pagamento, valor: v.total }];

  document.getElementById('modal-title').textContent = `🧾 Comanda — ${v.numero}`;
  document.getElementById('modal-body').innerHTML = `
    <div class="flex items-center justify-between mb-3" style="background:var(--bg);padding:10px 14px;border-radius:8px">
      <div>
        <div class="text-xs text-muted">Data e hora</div>
        <div class="font-bold">${dataHora.toLocaleDateString('pt-BR')} às ${dataHora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div>
      </div>
      <div style="text-align:right">
        <div class="text-xs text-muted">Cliente</div>
        <div class="font-bold">${v.clientes?.nome || 'Consumidor'}</div>
      </div>
      <div style="text-align:right">
        <div class="text-xs text-muted">Vendedor</div>
        <div class="font-bold">${v.funcionarios?.nome || '—'}</div>
      </div>
    </div>

    <div class="card-title mb-2" style="font-size:14px">🛍️ O que foi comprado</div>
    <table>
      <thead><tr><th>Produto</th><th>Qtd</th><th>Preço</th><th>Subtotal</th></tr></thead>
      <tbody>
        ${(v.venda_itens||[]).map(i => `
          <tr>
            <td>
              <div class="font-bold text-sm">${i.nome_produto}</div>
              <div class="text-xs text-muted">${[i.tamanho,i.cor].filter(Boolean).join(' • ')}</div>
            </td>
            <td>${i.quantidade}</td>
            <td class="text-sm text-muted">${fmtR(i.preco_unitario)}</td>
            <td class="font-bold">${fmtR(i.subtotal)}</td>
          </tr>
        `).join('') || '<tr><td colspan="4" style="text-align:center;color:var(--text-muted)">Sem detalhes de itens</td></tr>'}
      </tbody>
    </table>

    <div style="border-top:1px solid var(--border);margin-top:12px;padding-top:12px">
      ${pagamentos.map(p => `<div class="total-row"><span>${PAGAMENTO_ICONS[p.forma_pagamento]||''} ${PAGAMENTO_LABELS[p.forma_pagamento]||p.forma_pagamento}</span><span class="font-bold">${fmtR(p.valor)}</span></div>`).join('')}
      ${v.desconto_valor > 0 ? `<div class="total-row" style="color:var(--success)"><span>Desconto</span><span>−${fmtR(v.desconto_valor)}</span></div>` : ''}
      <div class="total-row big" style="border-top:2px solid var(--border);padding-top:8px;margin-top:6px"><span>Total</span><span>${fmtR(v.total)}</span></div>
    </div>
    ${v.status === 'cancelada' ? '<p class="text-xs mt-2" style="color:var(--danger)">Esta venda foi cancelada</p>' : ''}
  `;
  document.getElementById('modal-footer').innerHTML = `
    ${v.status !== 'cancelada' ? `
      <button class="btn btn-outline" onclick="modalCorrigirPagamento('${v.id}','${v.forma_pagamento}')">✏️ Corrigir pagamento</button>
      <button class="btn btn-outline" onclick="closeModal();navigate('trocas');setTimeout(()=>modalNovaTroca('${v.numero}'),200)">🔄 Trocar/Devolver</button>
      ${v.clientes?.telefone ? `<button class="btn btn-success" onclick='reenviarReciboWhatsapp(${JSON.stringify(v)})'>📱 WhatsApp</button>` : ''}
      <button class="btn btn-danger" onclick="confirmarCancelarVenda('${v.id}','${v.numero}')">🗑️ Cancelar Venda</button>
    ` : ''}
    <button class="btn btn-primary" onclick="closeModal()">Fechar</button>
  `;
}

async function confirmarCancelarVenda(vendaId, numero) {
  if (!confirm(`Cancelar a venda ${numero}? O estoque dos itens volta automaticamente. Essa ação não pode ser desfeita.`)) return;
  try {
    await api('PUT', `/api/vendas/${vendaId}/cancelar`);
    toast('Venda cancelada e estoque devolvido!', 'success');
    verVenda(vendaId); // recarrega a comanda já mostrando o status cancelado
  } catch (e) {
    toast('Erro: ' + e.message, 'error');
  }
}

function modalCorrigirPagamento(vendaId, formaAtual) {
  const labels = { dinheiro:'💵 Dinheiro', pix:'⚡ PIX', debito:'💳 Débito', credito:'💰 Crédito', crediario:'📅 Crediário', credito_loja:'🎁 Crédito de loja', misto:'🔀 Misto' };
  openModal('✏️ Corrigir Forma de Pagamento', `
    <p class="text-sm text-muted mb-3">Forma atual: <strong>${labels[formaAtual]||formaAtual}</strong></p>
    <p class="text-xs text-muted mb-3">Isso só corrige o rótulo da venda pra fins de conferência — não recalcula estoque nem valores. A correção fica registrada com seu usuário e o motivo.</p>
    <div class="form-group">
      <label>Nova forma de pagamento</label>
      <select id="corrigir-forma-nova">
        ${Object.entries(labels).filter(([k])=>k!=='misto').map(([k,l]) => `<option value="${k}" ${k===formaAtual?'selected':''}>${l}</option>`).join('')}
      </select>
    </div>
    <div class="form-group">
      <label>Motivo</label>
      <input type="text" id="corrigir-motivo" placeholder="Ex: registrado errado no caixa, era PIX não dinheiro...">
    </div>
  `, `
    <button class="btn btn-outline" onclick="verVenda('${vendaId}')">Cancelar</button>
    <button class="btn btn-primary" onclick="confirmarCorrecaoPagamento('${vendaId}')">Confirmar</button>
  `, 'modal-sm');
}

async function confirmarCorrecaoPagamento(vendaId) {
  const forma_pagamento_nova = document.getElementById('corrigir-forma-nova').value;
  const motivo = document.getElementById('corrigir-motivo').value;

  try {
    await api('PUT', `/api/vendas/${vendaId}/corrigir-pagamento`, { forma_pagamento_nova, motivo });
    const venda = STATE.vendas.find(v => v.id === vendaId);
    if (venda) venda.forma_pagamento = forma_pagamento_nova;
    toast('Pagamento corrigido!', 'success');
    verVenda(vendaId);
  } catch (e) {
    toast('Erro: ' + e.message, 'error');
  }
}

      <div class="card-header">
        <span class="card-title">🔄 Trocas e Devoluções</span>

        <div class="table-wrap">
          <table>
            <thead><tr><th>Venda original</th><th>Cliente</th><th>Tipo</th><th>Devolvido</th><th>Diferença</th><th>Data</th></tr></thead>
            <tbody>
              ${trocas.map(t => `
                <tr>
                  <td class="font-bold" style="${t.venda_original_id?'cursor:pointer;color:var(--primary)':''}" ${t.venda_original_id?`onclick="verVenda('${t.venda_original_id}')" title="Ver comanda original"`:''}>${t.vendas?.numero || '—'}</td>
                  <td>${t.clientes?.nome || 'Consumidor'}</td>
                  <td><span class="badge ${tipoBadge[t.tipo]||'badge-gray'}">${tipoLabel[t.tipo]||t.tipo}</span></td>
                  <td>${fmtR(t.valor_devolvido)}</td>
                  <td style="color:${t.valor_diferenca>0?'var(--danger)':t.valor_diferenca<0?'var(--success)':'var(--text-muted)'}">${t.valor_diferenca!==0?fmtR(Math.abs(t.valor_diferenca)):'—'}</td>
                  <td class="text-sm text-muted">${new Date(t.criado_em).toLocaleDateString('pt-BR')}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
  `);
}

async function modalNovaTroca(numeroPreenchido) {
  window._troca = { venda: null, itensDevolvidos: {}, tipo: 'credito', itensNovos: [] };
  window._trocaVendasCache = [];

  openModal('🔄 Nova Troca — Buscar Venda', `
    <div class="form-group">
      <label>Buscar por número da venda ou nome do cliente</label>
      <input type="text" id="troca-busca-numero" placeholder="Ex: V-00012 ou nome do cliente" value="${numeroPreenchido || ''}" oninput="filtrarVendasTroca()" autofocus>
    </div>
    <div id="troca-busca-resultado" class="mt-2" style="max-height:320px;overflow-y:auto"></div>
  `, `
    <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
  `, 'modal-md');

  document.getElementById('troca-busca-resultado').innerHTML = '<p class="text-sm text-muted">Carregando vendas recentes...</p>';

  try {
    const r = await api('GET', '/api/vendas?limit=200');
    window._trocaVendasCache = r?.data || (Array.isArray(r) ? r : []);
    filtrarVendasTroca();
  } catch (e) {
    document.getElementById('troca-busca-resultado').innerHTML = `<p class="text-sm" style="color:var(--danger)">${e.message}</p>`;
  }
}

function filtrarVendasTroca() {
  const q = (document.getElementById('troca-busca-numero')?.value || '').toLowerCase().trim();
  let lista = window._trocaVendasCache.filter(v => v.status !== 'cancelada');

  if (q) {
    lista = lista.filter(v =>
      v.numero.toLowerCase().includes(q) ||
      (v.clientes?.nome || '').toLowerCase().includes(q)
    );
  }
  lista = lista.slice(0, 15); // mostra os 15 mais recentes/relevantes, evita lista gigante

  const fmtR = val => `R$ ${(val||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}`;
  const resEl = document.getElementById('troca-busca-resultado');

  if (lista.length === 0) {
    resEl.innerHTML = '<p class="text-sm text-muted">Nenhuma venda encontrada</p>';
    return;
  }

  resEl.innerHTML = lista.map(v => `
    <div onclick="selecionarVendaTroca('${v.id}')" style="cursor:pointer;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;transition:all .15s"
      onmouseover="this.style.borderColor='var(--primary)';this.style.background='var(--primary-light)'"
      onmouseout="this.style.borderColor='var(--border)';this.style.background='transparent'">
      <div class="flex items-center justify-between">
        <span class="font-bold">${v.numero}</span>
        <span class="font-bold">${fmtR(v.total)}</span>
      </div>
      <div class="flex items-center justify-between text-xs text-muted mt-1">
        <span>${v.clientes?.nome || 'Consumidor'}</span>
        <span>${new Date(v.criado_em).toLocaleDateString('pt-BR')} às ${new Date(v.criado_em).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span>
      </div>
    </div>
  `).join('');
}

async function selecionarVendaTroca(vendaId) {
  document.getElementById('troca-busca-resultado').innerHTML = '<p class="text-sm text-muted">Abrindo venda...</p>';
  try {
    const vendaCompleta = await api('GET', `/api/vendas/${vendaId}`);
    window._troca.venda = vendaCompleta;
    renderStep2SelecionarItens();
  } catch (e) {
    toast('Erro ao abrir venda: ' + e.message, 'error');
  }
}

function renderStep2SelecionarItens() {
  const venda = window._troca.venda;
  const itens = venda.venda_itens || [];

  openModal(`🔄 Troca — Venda ${venda.numero}`, `
    <p class="text-sm text-muted mb-3">Marque os itens que estão voltando e a quantidade:</p>
    ${itens.map(item => `
      <div class="flex items-center gap-2 mb-2" style="padding:8px;background:var(--bg);border-radius:8px">
        <input type="checkbox" id="troca-check-${item.variacao_id}" onchange="toggleItemDevolvido('${item.variacao_id}', this.checked, ${item.quantidade}, ${item.preco_unitario}, '${(item.nome_produto||'').replace(/'/g,"&#39;")}')">
        <div style="flex:1">
          <div class="font-bold text-sm">${item.nome_produto}</div>
          <div class="text-xs text-muted">${[item.tamanho, item.cor].filter(Boolean).join(' • ')} — comprado: ${item.quantidade} un.</div>
        </div>
        <input type="number" id="troca-qtd-${item.variacao_id}" min="1" max="${item.quantidade}" value="1" style="width:60px" disabled
          oninput="setQtdDevolvida('${item.variacao_id}', this.value)">
      </div>
    `).join('')}

    <div class="form-group mt-3">
      <label>O que fazer com o valor devolvido?</label>
      <select id="troca-tipo" onchange="window._troca.tipo=this.value">
        <option value="credito">🎁 Gerar crédito de loja pro cliente</option>
        <option value="reembolso">💸 Reembolsar (sai do caixa)</option>
        <option value="troca_direta">🔄 Cliente já leva outra peça no lugar</option>
      </select>
    </div>
  `, `
    <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="avancarTroca()">Continuar</button>
  `, 'modal-lg');
}

function toggleItemDevolvido(variacao_id, checked, quantidadeMax, preco_unitario, nome_produto) {
  const qtdInput = document.getElementById(`troca-qtd-${variacao_id}`);
  qtdInput.disabled = !checked;
  if (checked) {
    window._troca.itensDevolvidos[variacao_id] = { variacao_id, quantidade: Number(qtdInput.value) || 1, preco_unitario, nome_produto };
  } else {
    delete window._troca.itensDevolvidos[variacao_id];
  }
}

function setQtdDevolvida(variacao_id, qtd) {
  if (window._troca.itensDevolvidos[variacao_id]) {
    window._troca.itensDevolvidos[variacao_id].quantidade = Number(qtd) || 1;
  }
}

function avancarTroca() {
  window._troca.tipo = document.getElementById('troca-tipo').value;
  const itens = Object.values(window._troca.itensDevolvidos);
  if (itens.length === 0) return toast('Selecione ao menos um item pra devolver', 'error');

  if (window._troca.tipo === 'credito' && !window._troca.venda.cliente_id) {
    return toast('Essa venda não tem cliente — troca por crédito exige cliente', 'error');
  }

  if (window._troca.tipo === 'troca_direta') {
    renderStep3ItensNovos();
  } else {
    confirmarTroca();
  }
}

async function renderStep3ItensNovos() {
  if (!STATE.produtos || STATE.produtos.length === 0) {
    try {
      const r = await api('GET', '/api/produtos?limit=500');
      STATE.produtos = r?.data || (Array.isArray(r) ? r : []);
    } catch (e) { /* segue mesmo assim */ }
  }

  const valorDevolvido = Object.values(window._troca.itensDevolvidos).reduce((s, i) => s + i.preco_unitario * i.quantidade, 0);

  openModal('🔄 Troca — Escolher peça nova', `
    <p class="text-sm text-muted mb-2">Valor sendo devolvido: <strong>R$ ${valorDevolvido.toFixed(2).replace('.',',')}</strong></p>
    <div class="form-group">
      <label>Buscar produto</label>
      <input type="text" id="troca-busca-produto" placeholder="Nome do produto..." oninput="renderListaProdutosTroca()">
    </div>
    <div id="troca-lista-produtos" style="max-height:180px;overflow-y:auto"></div>
    <div id="troca-itens-novos-selecionados" class="mt-3"></div>
    <div id="troca-resumo-diferenca" class="mt-3"></div>
  `, `
    <button class="btn btn-outline" onclick="renderStep2SelecionarItens()">Voltar</button>
    <button class="btn btn-primary" onclick="confirmarTroca()">Finalizar Troca</button>
  `, 'modal-lg');

  renderListaProdutosTroca();
  renderItensNovosSelecionados();
}

function renderListaProdutosTroca() {
  const q = (document.getElementById('troca-busca-produto')?.value || '').toLowerCase();
  if (!q) { document.getElementById('troca-lista-produtos').innerHTML = ''; return; }

  const encontrados = STATE.produtos.filter(p => p.ativo && p.nome.toLowerCase().includes(q)).slice(0, 8);
  document.getElementById('troca-lista-produtos').innerHTML = encontrados.map(p => `
    <div class="flex items-center justify-between" style="padding:6px 8px;border-bottom:1px solid var(--border)">
      <span class="text-sm">${p.nome} <span class="text-muted">R$ ${p.preco_venda.toFixed(2).replace('.',',')}</span></span>
      <button class="btn btn-outline btn-sm" onclick='abrirVariacoesTroca(${JSON.stringify(p.id)})'>Escolher</button>
    </div>
  `).join('') || '<p class="text-sm text-muted">Nenhum produto encontrado</p>';
}

function abrirVariacoesTroca(prodId) {
  const prod = STATE.produtos.find(p => p.id === prodId);
  if (!prod) return;
  const variacoes = (prod.variacoes || []).filter(v => v.estoque > 0);
  if (variacoes.length === 0) return toast('Sem estoque desse produto', 'error');

  document.getElementById('troca-lista-produtos').innerHTML = `
    <p class="text-xs text-muted mb-2">Tamanho/cor de ${prod.nome}:</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px">
      ${variacoes.map(v => `
        <button class="btn btn-outline btn-sm" onclick='adicionarItemNovoTroca(${JSON.stringify(prod.id)},${JSON.stringify(v.id)},${JSON.stringify(prod.nome)},${prod.preco_venda},${JSON.stringify(v.tamanho)},${JSON.stringify(v.cor)})'>
          ${v.tamanho||''} ${v.cor||''}
        </button>
      `).join('')}
    </div>
  `;
}

function adicionarItemNovoTroca(produto_id, variacao_id, nome, preco_venda, tamanho, cor) {
  window._troca.itensNovos.push({ variacao_id, produto_id, nome_produto: nome, preco_unitario: preco_venda, tamanho, cor, quantidade: 1 });
  document.getElementById('troca-busca-produto').value = '';
  document.getElementById('troca-lista-produtos').innerHTML = '';
  renderItensNovosSelecionados();
}

function removerItemNovoTroca(idx) {
  window._troca.itensNovos.splice(idx, 1);
  renderItensNovosSelecionados();
}

function renderItensNovosSelecionados() {
  const el = document.getElementById('troca-itens-novos-selecionados');
  const resumoEl = document.getElementById('troca-resumo-diferenca');
  if (!el) return;

  el.innerHTML = window._troca.itensNovos.length === 0 ? '<p class="text-sm text-muted">Nenhuma peça nova adicionada ainda</p>' :
    window._troca.itensNovos.map((item, idx) => `
      <div class="flex items-center justify-between" style="padding:6px 8px;background:var(--bg);border-radius:8px;margin-bottom:4px">
        <span class="text-sm">${item.nome_produto} ${[item.tamanho,item.cor].filter(Boolean).join(' • ')} — R$ ${item.preco_unitario.toFixed(2).replace('.',',')}</span>
        <button onclick="removerItemNovoTroca(${idx})" style="background:none;border:none;color:var(--danger);cursor:pointer">✕</button>
      </div>
    `).join('');

  const valorDevolvido = Object.values(window._troca.itensDevolvidos).reduce((s, i) => s + i.preco_unitario * i.quantidade, 0);
  const valorNovo = window._troca.itensNovos.reduce((s, i) => s + i.preco_unitario * i.quantidade, 0);
  const diferenca = valorNovo - valorDevolvido;

  let extraHtml = '';
  if (diferenca > 0.01) {
    extraHtml = `
      <div class="form-group">
        <label>Cliente paga a diferença de R$ ${diferenca.toFixed(2).replace('.',',')} — forma de pagamento:</label>
        <select id="troca-forma-diferenca">
          <option value="dinheiro">💵 Dinheiro</option>
          <option value="pix">⚡ PIX</option>
          <option value="debito">💳 Débito</option>
          <option value="credito">💰 Crédito</option>
        </select>
      </div>`;
  } else if (diferenca < -0.01) {
    extraHtml = `
      <div class="form-group">
        <label>Sobra R$ ${Math.abs(diferenca).toFixed(2).replace('.',',')} — o que fazer?</label>
        <select id="troca-destino-sobra">
          <option value="credito">🎁 Vira crédito de loja</option>
          <option value="reembolso">💸 Reembolsar</option>
        </select>
      </div>`;
  } else if (window._troca.itensNovos.length > 0) {
    extraHtml = '<p class="text-sm" style="color:var(--success)">✓ Valores se equivalem, sem diferença a pagar</p>';
  }
  if (resumoEl) resumoEl.innerHTML = extraHtml;
}

async function confirmarTroca() {
  const t = window._troca;
  const payload = {
    venda_original_id: t.venda.id,
    itens_devolvidos: Object.values(t.itensDevolvidos).map(i => ({ variacao_id: i.variacao_id, quantidade: i.quantidade })),
    tipo: t.tipo
  };

  if (t.tipo === 'troca_direta') {
    if (t.itensNovos.length === 0) return toast('Adicione a peça nova da troca', 'error');
    payload.itens_novos = t.itensNovos.map(i => ({ variacao_id: i.variacao_id, quantidade: i.quantidade }));
    const formaDif = document.getElementById('troca-forma-diferenca')?.value;
    const destinoSobra = document.getElementById('troca-destino-sobra')?.value;
    if (formaDif) payload.forma_pagamento_diferenca = formaDif;
    if (destinoSobra) payload.destino_sobra = destinoSobra;
  }

  try {
    await api('POST', '/api/trocas', payload);
    toast('Troca registrada com sucesso!', 'success');
    closeModal();
    window._troca = null;
    renderTrocas();
  } catch (e) {
    toast('Erro: ' + e.message, 'error');
  }
}

      <div class="form-group"><label>Cargo</label><input type="text" id="func-cargo" value="${f?.cargo||'Vendedor'}" placeholder="Ex: Vendedor, Gerente..."></div>

      <div class="form-group"><label>Email</label><input type="email" id="func-email" value="${f?.email||''}"></div>

    </div>
    <div class="form-row-3">
      <div class="form-group"><label>Salário Base (R$)</label><input type="number" id="func-sal" value="${f?.salario_base||0}" min="0"></div>
      <div class="form-group"><label>Comissão (%)</label><input type="number" id="func-com" value="${f?.comissao_pct||0}" min="0" max="100" step="0.1"></div>
      <div class="form-group"><label>Meta Mensal (R$)</label><input type="number" id="func-meta" value="${f?.meta_mensal||0}" min="0"></div>
    </div>

      <label>Data de Admissão</label>
      <input type="date" id="func-admissao" value="${f?.data_admissao||''}">
    </div>
  `, `
    <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="salvarFunc('${id||''}')">💾 Salvar</button>
  `);
}

async function salvarFunc(id) {
  const nome = document.getElementById('func-nome').value;
  if (!nome) return toast('Nome obrigatório', 'error');
  const dados = {
    nome, cargo: document.getElementById('func-cargo').value,
    email: document.getElementById('func-email').value,
    telefone: document.getElementById('func-tel').value,
    salario_base: parseFloat(document.getElementById('func-sal').value||0),
    comissao_pct: parseFloat(document.getElementById('func-com').value||0),
    meta_mensal: parseFloat(document.getElementById('func-meta').value||0),
    data_admissao: document.getElementById('func-admissao').value
  };
  try {
    if (id) {
      await api('PUT', `/api/operacoes/funcionarios/${id}`, dados);
      toast('Funcionário atualizado!', 'success');
    } else {
      await api('POST', '/api/operacoes/funcionarios', dados);
      toast('Funcionário cadastrado!', 'success');
    }
    closeModal();
    renderFuncionarios();
  } catch (e) {
    toast('Erro: ' + e.message, 'error');
  }
}

// ============================================================
function renderComissoes() {
  const fmtR = v => `R$ ${(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}`;
  const mes = new Date().getMonth() + 1;
  const ano = new Date().getFullYear();

  const comissoes = STATE.funcionarios.filter(f=>f.ativo).map(f => {
    const vendasFunc = STATE.vendas.filter(v => v.funcionario_id === f.id && v.status === 'finalizada');
    const totalVendas = vendasFunc.reduce((s, v) => s + v.total, 0);
    const comissao = totalVendas * (f.comissao_pct / 100);
    const pctMeta = f.meta_mensal > 0 ? Math.min(100, (totalVendas / f.meta_mensal) * 100) : 0;
    return { ...f, totalVendas, comissao, numVendas: vendasFunc.length, pctMeta };
  });

  setContent(`
    <div class="card mb-4">
      <div class="card-header">
        <span class="card-title">🏆 Ranking de Vendas — ${new Date().toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</span>
      </div>
      ${comissoes.sort((a,b) => b.totalVendas - a.totalVendas).map((f, i) => `
        <div style="display:flex;align-items:center;gap:16px;padding:16px;border-bottom:1px solid var(--border);${i===0?'background:linear-gradient(90deg,#fef9c3,transparent)':''}">
          <div style="font-size:28px;font-weight:900;color:${['#f59e0b','#94a3b8','#cd7f32'][i]||'var(--text-muted)'};width:40px">${['🥇','🥈','🥉'][i]||'#'+(i+1)}</div>
          <div class="avatar" style="width:44px;height:44px">${f.nome[0]}</div>
          <div style="flex:1">
            <div class="font-bold">${f.nome} <span class="text-xs text-muted">${f.cargo}</span></div>
            <div class="flex items-center gap-2 mt-1">
              <div class="progress" style="flex:1;height:6px"><div class="progress-bar" style="width:${f.pctMeta}%;background:${f.pctMeta>=100?'var(--success)':'var(--primary)'}"></div></div>
              <span class="text-xs text-muted">${f.pctMeta.toFixed(0)}% da meta</span>
            </div>
          </div>
          <div style="text-align:right">
            <div class="font-bold" style="font-size:16px">${fmtR(f.totalVendas)}</div>
            <div class="text-xs text-muted">${f.numVendas} vendas</div>
          </div>
          <div style="text-align:right;min-width:100px">

async function renderFinanceiro() {
  loading();
  let caixa = null, movimentacoes = [];
  try {
    const [caixaR, movsR] = await Promise.all([
      api('GET', '/api/operacoes/caixa/atual'),
      api('GET', '/api/operacoes/movimentacoes?limit=100')
    ]);
    caixa = caixaR;
    movimentacoes = movsR?.data || (Array.isArray(movsR) ? movsR : []);
  } catch (e) {
    setContent(`<div class="empty-state"><div class="empty-icon">⚠️</div><p>${e.message}</p><button class="btn btn-primary" onclick="renderFinanceiro()">Tentar novamente</button></div>`);
    return;
  }
  window._financeiroMovs = movimentacoes;
  window._caixaAtualReal = caixa;
  STATE.caixaAtual = caixa;
  updateSidebar();

  const fmtR = v => `R$ ${(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}`;
  const movsDoCaixa = caixa ? movimentacoes.filter(m => m.caixa_id === caixa.id) : movimentacoes;

  // Dinheiro físico é só o que entrou/saiu EM ESPÉCIE — pix, débito e
  // crédito não ficam na gaveta, caem direto na conta/maquininha.
  const entradasDinheiro = movsDoCaixa.filter(m => m.tipo === 'entrada' && m.forma_pagamento === 'dinheiro').reduce((s, m) => s + m.valor, 0);
  const saidasDinheiro = movsDoCaixa.filter(m => m.tipo === 'saida' && m.forma_pagamento === 'dinheiro').reduce((s, m) => s + m.valor, 0);
  const dinheiroEsperadoNaGaveta = (caixa?.saldo_inicial || 0) + entradasDinheiro - saidasDinheiro;

  const totalVendasHoje = movsDoCaixa.filter(m => m.tipo === 'entrada' && m.categoria === 'venda').reduce((s, m) => s + m.valor, 0);
  const porFormaPagamento = {};
  movsDoCaixa.filter(m => m.tipo === 'entrada').forEach(m => {
    porFormaPagamento[m.forma_pagamento] = (porFormaPagamento[m.forma_pagamento] || 0) + m.valor;
  });

  setContent(`
    <div class="card mb-4" style="background:${caixa ? 'linear-gradient(135deg,var(--primary),var(--primary-dark))' : 'var(--surface)'};${caixa?'border:none':''}">
      ${caixa ? `
        <div class="flex items-center justify-between mb-3">
          <span style="color:white;font-weight:700;font-size:16px">🧾 Caixa aberto desde ${new Date(caixa.aberto_em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span>
          <span class="badge badge-green">Aberto</span>
        </div>
        <div style="background:rgba(255,255,255,.15);border-radius:10px;padding:16px;margin-bottom:12px">
          <p style="color:white;font-size:14px;line-height:1.6;margin:0">
            Você abriu com <strong>${fmtR(caixa.saldo_inicial)}</strong> em dinheiro.
            Entrou <strong>${fmtR(entradasDinheiro)}</strong> em espécie e saiu <strong>${fmtR(saidasDinheiro)}</strong> (sangrias/despesas).
            <br>💰 <strong>Deveria ter ${fmtR(dinheiroEsperadoNaGaveta)} na gaveta agora.</strong>
          </p>
        </div>
        <div class="flex gap-2">
          <button class="btn btn-outline" style="background:white" onclick="openSangria('${caixa.id}')">💸 Sangria</button>
          <button class="btn btn-danger" onclick="fecharCaixa('${caixa.id}', ${dinheiroEsperadoNaGaveta})">🔒 Fechar Caixa</button>
        </div>
      ` : `
        <div style="text-align:center;padding:20px">
          <div style="font-size:40px;margin-bottom:8px">🔓</div>
          <p class="text-muted mb-3">Nenhum caixa aberto agora. Abra pra começar a vender e registrar o dinheiro do dia.</p>
          <button class="btn btn-success" onclick="abrirCaixa()">Abrir Caixa</button>
        </div>
      `}
    </div>

    <div class="grid grid-3 mb-4">
      <div class="stat-card">
        <div class="stat-icon" style="background:#d1fae5">🛒</div>
        <div><div class="stat-label">Vendas (caixa atual)</div><div class="stat-value">${fmtR(totalVendasHoje)}</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#e0e7ff">💵</div>
        <div><div class="stat-label">Dinheiro na gaveta</div><div class="stat-value">${fmtR(dinheiroEsperadoNaGaveta)}</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#fef3c7">📊</div>
        <div><div class="stat-label">Formas de pagamento</div><div class="stat-value" style="font-size:14px">${Object.keys(porFormaPagamento).length} tipos usados</div></div>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-header"><span class="card-title">📊 Quanto entrou em cada forma de pagamento</span></div>
      ${Object.keys(porFormaPagamento).length === 0 ? '<p class="text-sm text-muted">Nenhuma entrada registrada nesse caixa ainda</p>' :
        Object.entries(porFormaPagamento).map(([k,v]) => {
          const labels = { dinheiro:'💵 Dinheiro (fica na gaveta)', pix:'⚡ PIX (cai na conta)', debito:'💳 Débito (cai na conta)', credito:'💰 Crédito (cai na conta)', crediario:'📅 Crediário (a receber depois)', credito_loja:'🎁 Crédito de loja usado' };
          return `<div class="total-row"><span>${labels[k]||k}</span><span class="font-bold">${fmtR(v)}</span></div>`;
        }).join('')}
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">📋 Lançamentos manuais</span>
        <button class="btn btn-primary btn-sm" onclick="openMovimentacaoModal('${caixa?.id||''}')">+ Lançar despesa/entrada</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Forma</th><th>Valor</th></tr></thead>
          <tbody>
            ${movimentacoes.length === 0 ? '<tr><td colspan="5" style="text-align:center;color:var(--text-muted)">Nenhuma movimentação ainda</td></tr>' : movimentacoes.slice(0,30).map(m => `<tr>
              <td class="text-sm text-muted">${new Date(m.criado_em).toLocaleDateString('pt-BR')} ${new Date(m.criado_em).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</td>
              <td><span class="badge ${m.tipo==='entrada'?'badge-green':'badge-red'}">${m.tipo==='entrada'?'Entrada':'Saída'}</span></td>
              <td>${m.descricao}</td>
              <td>${pagBadge(m.forma_pagamento)}</td>
              <td class="font-bold" style="color:${m.tipo==='entrada'?'var(--success)':'var(--danger)'}">${m.tipo==='entrada'?'+':'−'}${fmtR(m.valor)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `);
}

    <p class="text-sm text-muted mb-3">Conte o dinheiro físico que está colocando na gaveta agora:</p>

    <button class="btn btn-success" onclick="confirmarAbrirCaixa()">Abrir Caixa</button>
  `, 'modal-sm');
}

async function confirmarAbrirCaixa() {
  const saldo_inicial = parseFloat(document.getElementById('caixa-inicial').value || 0);
  try {
    await api('POST', '/api/operacoes/caixa/abrir', { saldo_inicial, funcionario_id: null });

function fecharCaixa(caixaId, valorEsperado) {
  openModal('🔒 Fechar Caixa', `
    <p class="text-sm text-muted mb-3">Conte o dinheiro físico que está na gaveta agora.</p>
    <div style="background:var(--bg);padding:12px;border-radius:8px;margin-bottom:14px;text-align:center">
      <div class="text-xs text-muted">O sistema calculou que deveria ter</div>
      <div style="font-size:22px;font-weight:800;color:var(--primary)">R$ ${valorEsperado.toFixed(2).replace('.',',')}</div>
    </div>
    <div class="form-group">
      <label>Quanto tem de verdade na gaveta? (R$)</label>
      <input type="number" id="caixa-saldo-final" value="${valorEsperado.toFixed(2)}" min="0" step="0.01" oninput="mostrarDiferencaFechamento(${valorEsperado})">
    </div>
    <p id="diferenca-fechamento" class="text-sm mt-2"></p>
    <div class="form-group mt-2"><label>Observações (opcional)</label><input type="text" id="caixa-obs-fechamento" placeholder="Ex: sobrou R$5, deu tudo certo..."></div>
  `, `
    <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-danger" onclick="confirmarFecharCaixa('${caixaId}')">Confirmar Fechamento</button>
  `, 'modal-sm');
}

function mostrarDiferencaFechamento(esperado) {
  const informado = parseFloat(document.getElementById('caixa-saldo-final').value || 0);
  const dif = informado - esperado;
  const el = document.getElementById('diferenca-fechamento');
  if (Math.abs(dif) < 0.01) el.innerHTML = '<span style="color:var(--success)">✓ Bateu certinho!</span>';
  else if (dif > 0) el.innerHTML = `<span style="color:var(--warning)">Sobrou R$ ${dif.toFixed(2).replace('.',',')}</span>`;
  else el.innerHTML = `<span style="color:var(--danger)">Faltou R$ ${Math.abs(dif).toFixed(2).replace('.',',')}</span>`;
}

async function confirmarFecharCaixa(caixaId) {
  const saldo_final = parseFloat(document.getElementById('caixa-saldo-final').value || 0);
  const observacoes = document.getElementById('caixa-obs-fechamento').value;
  try {
    await api('POST', '/api/operacoes/caixa/fechar', { caixa_id: caixaId, saldo_final, observacoes });

async function renderCrediario() {
  loading();
  const fmtR = v => `R$ ${(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}`;
  let crediarios = [];
  try {
    const d = await api('GET', '/api/relatorios/crediario');
    crediarios = Array.isArray(d) ? d : [];
  } catch(e) {
    setContent(`<div class="empty-state"><div class="empty-icon">⚠️</div><p>${e.message}</p><button class="btn btn-primary" onclick="renderCrediario()">Tentar novamente</button></div>`);
    return;
  }
  window._crediarios = crediarios;
  const totalSaldo = crediarios.filter(c=>c.status!=='quitado').reduce((s,c)=>s+(c.saldo||0),0);
  const inadimplentes = crediarios.filter(c=>c.status==='inadimplente').length;
  const quitados = crediarios.filter(c=>c.status==='quitado').length;

  setContent(`
    <div class="grid grid-3 mb-4">
      <div class="stat-card"><div class="stat-icon" style="background:#e0e7ff">📅</div><div><div class="stat-label">A Receber</div><div class="stat-value">${fmtR(totalSaldo)}</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#fee2e2">⚠️</div><div><div class="stat-label">Inadimplentes</div><div class="stat-value">${inadimplentes}</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#d1fae5">✅</div><div><div class="stat-label">Quitados</div><div class="stat-value">${quitados}</div></div></div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">📅 Crediário</span></div>
      ${crediarios.length === 0 ?
        '<div class="empty-state"><div class="empty-icon">📅</div><p>Nenhum crediário cadastrado</p></div>' :
        `<div class="table-wrap"><table>
          <thead><tr><th>Cliente</th><th>Total</th><th>Pago</th><th>Saldo</th><th>Parcelas</th><th>Vencimento</th><th>Status</th><th>Ação</th></tr></thead>
          <tbody>
            ${crediarios.map(c => `<tr>
              <td class="font-bold">${c.clientes?.nome||'—'}</td>
              <td>${fmtR(c.total)}</td>
              <td style="color:var(--success)">${fmtR(c.pago||0)}</td>
              <td class="font-bold">${fmtR(c.saldo||0)}</td>
              <td class="text-muted">${c.parcelas_pagas||0}/${c.parcelas||1}</td>
              <td class="text-sm">${c.vencimento ? new Date(c.vencimento).toLocaleDateString('pt-BR') : '—'}</td>
              <td><span class="badge ${c.status==='quitado'?'badge-green':c.status==='inadimplente'?'badge-red':'badge-yellow'}">${c.status}</span></td>
              <td>
                <div class="flex gap-1">
                  ${c.status!=='quitado'?`<button class="btn btn-success btn-sm" onclick="modalPagamento('${c.id}',${c.saldo||0},${c.parcelas||1},${c.parcelas_pagas||0})">💰 Receber</button>`:''}
                  ${c.status!=='quitado' && c.clientes?.telefone ? `<button class="btn btn-outline btn-sm" onclick='cobrarCrediarioWhatsapp(${JSON.stringify(c)})'>📱</button>` : ''}
                </div>
              </td>
            </tr>`).join('')}
          </tbody>
        </table></div>`
      }
    </div>
  `);
}

function cobrarCrediarioWhatsapp(c) {
  const fmtR = v => `R$ ${(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}`;
  const nomeLoja = STATE.loja?.nome || 'nossa loja';
  const nomeCliente = (c.clientes?.nome || '').split(' ')[0];
  const vencimentoTxt = c.vencimento ? new Date(c.vencimento).toLocaleDateString('pt-BR') : 'em aberto';

  const mensagem = `Olá${nomeCliente ? ' ' + nomeCliente : ''}! 👋 Passando pra lembrar do seu crediário na ${nomeLoja}.\n\n💰 Saldo em aberto: ${fmtR(c.saldo)}\n📅 Vencimento: ${vencimentoTxt}\n\nQualquer dúvida, é só responder aqui. Obrigado! 💜`;

  abrirWhatsapp(c.clientes?.telefone, mensagem);
}

function modalPagamento(id, saldoAtual, totalParcelas, parcelasPagas) {
  const fmtR = v => `R$ ${(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}`;
  const parcelasRestantes = totalParcelas - parcelasPagas;
  const valorParcela = parcelasRestantes > 0 ? (saldoAtual / parcelasRestantes).toFixed(2) : saldoAtual.toFixed(2);

  openModal('💰 Registrar Pagamento',`
    <div style="background:var(--bg);padding:12px;border-radius:8px;margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>Saldo devedor</span><strong>${fmtR(saldoAtual)}</strong></div>
      <div style="display:flex;justify-content:space-between"><span>Parcelas restantes</span><strong>${parcelasRestantes}</strong></div>
    </div>
    <div class="form-group">
      <label>Tipo de pagamento</label>
      <select class="fi" id="pag-tipo" onchange="atualizarValorPag(${saldoAtual},${valorParcela})">
        <option value="parcela">Pagar 1 parcela (${fmtR(parseFloat(valorParcela))})</option>
        <option value="total">Quitar tudo (${fmtR(saldoAtual)})</option>
        <option value="personalizado">Valor personalizado</option>
      </select>
    </div>
    <div class="form-group">
      <label>Valor a receber (R$)</label>
      <input class="fi" type="number" id="pag-val" value="${valorParcela}" min="0.01" step="0.01" max="${saldoAtual}">
    </div>
    <div class="form-group">
      <label>Forma de pagamento</label>
      <select class="fi" id="pag-forma">
        <option value="dinheiro">💵 Dinheiro</option>
        <option value="pix">⚡ PIX</option>
        <option value="debito">💳 Débito</option>
        <option value="credito">💰 Crédito</option>
      </select>
    </div>
  `,`
    <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-success" onclick="confirmarPagCred('${id}',${saldoAtual})">✅ Confirmar</button>
  `,'modal-sm');
}

function atualizarValorPag(saldoTotal, valorParcela) {
  const tipo = document.getElementById('pag-tipo').value;
  const input = document.getElementById('pag-val');
  if (tipo === 'parcela') input.value = valorParcela;
  else if (tipo === 'total') input.value = saldoTotal.toFixed(2);
  // personalizado: deixa o usuário digitar
}

async function confirmarPagCred(id, saldoAtual) {
  const val = parseFloat(document.getElementById('pag-val').value || 0);
  const forma = document.getElementById('pag-forma').value;
  if (!val || val <= 0) return toast('Informe o valor', 'error');
  if (val > saldoAtual + 0.01) return toast(`Valor maior que o saldo (${(saldoAtual).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})})`, 'error');

  try {
    await api('POST', `/api/relatorios/crediario/${id}/pagar`, {
      valor: val,
      forma_pagamento: forma,
      quitar: val >= saldoAtual - 0.01
    });
    toast(`Pagamento de R$ ${val.toFixed(2).replace('.',',')} registrado!`, 'success');
    closeModal();
    renderCrediario();
  } catch(e) {
    toast('Erro: ' + e.message, 'error');
  }
}

function renderListaProdutosPedido() {
  const q = (document.getElementById('ped-busca-produto')?.value || '').toLowerCase();
  const el = document.getElementById('ped-lista-produtos');
  if (!q) { el.innerHTML = ''; return; }

  const encontrados = STATE.produtos.filter(p => p.ativo && p.nome.toLowerCase().includes(q)).slice(0, 8);
  el.innerHTML = encontrados.map(p => `
    <div class="flex items-center justify-between" style="padding:6px 8px;border-bottom:1px solid var(--border)">
      <span class="text-sm">${p.nome} <span class="text-muted">R$ ${p.preco_venda.toFixed(2).replace('.',',')}</span></span>
      <button class="btn btn-outline btn-sm" onclick='abrirVariacoesPedido(${JSON.stringify(p.id)})'>Escolher</button>
    </div>
  `).join('') || '<p class="text-sm text-muted">Nenhum produto encontrado</p>';
}

function abrirVariacoesPedido(prodId) {
  const prod = STATE.produtos.find(p => p.id === prodId);
  if (!prod) return;
  const variacoes = prod.variacoes || [];
  document.getElementById('ped-lista-produtos').innerHTML = `
    <p class="text-xs text-muted mb-2">Tamanho/cor de ${prod.nome}:</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px">
      ${variacoes.map(v => `
        <button class="btn btn-outline btn-sm" onclick='adicionarItemPedido(${JSON.stringify(prod.id)},${JSON.stringify(v.id)},${JSON.stringify(prod.nome)},${prod.preco_venda},${JSON.stringify(v.tamanho)},${JSON.stringify(v.cor)})'>
          ${v.tamanho||''} ${v.cor||''}
        </button>
      `).join('') || '<span class="text-xs text-muted">Sem variações cadastradas</span>'}
    </div>
  `;
}

function adicionarItemPedido(produto_id, variacao_id, nome, preco_venda, tamanho, cor) {
  window._pedidoItens.push({ variacao_id, produto_id, nome_produto: nome, preco_unitario: preco_venda, tamanho, cor, quantidade: 1 });
  document.getElementById('ped-busca-produto').value = '';
  document.getElementById('ped-lista-produtos').innerHTML = '';
  renderItensPedidoSelecionados();
}

function removerItemPedido(idx) {
  window._pedidoItens.splice(idx, 1);
  renderItensPedidoSelecionados();
}

function alterarQtdItemPedido(idx, delta) {
  const item = window._pedidoItens[idx];
  item.quantidade = Math.max(1, item.quantidade + delta);
  renderItensPedidoSelecionados();
}

function renderItensPedidoSelecionados() {
  const el = document.getElementById('ped-itens-selecionados');
  if (!el) return;
  const fmtR = v => `R$ ${(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}`;

  if (window._pedidoItens.length === 0) {
    el.innerHTML = '<p class="text-sm text-muted">Nenhum produto adicionado ainda</p>';
    return;
  }

  const total = window._pedidoItens.reduce((s, i) => s + i.preco_unitario * i.quantidade, 0);
  el.innerHTML = `
    ${window._pedidoItens.map((item, idx) => `
      <div class="flex items-center justify-between" style="padding:6px 8px;background:var(--bg);border-radius:8px;margin-bottom:4px">
        <span class="text-sm">${item.nome_produto} ${[item.tamanho,item.cor].filter(Boolean).join(' • ')}</span>
        <div class="flex items-center gap-2">
          <button class="qty-btn" onclick="alterarQtdItemPedido(${idx},-1)">−</button>
          <span class="text-sm font-bold">${item.quantidade}</span>
          <button class="qty-btn" onclick="alterarQtdItemPedido(${idx},1)">+</button>
          <span class="text-sm font-bold" style="min-width:70px;text-align:right">${fmtR(item.preco_unitario*item.quantidade)}</span>
          <button onclick="removerItemPedido(${idx})" style="background:none;border:none;color:var(--danger);cursor:pointer">✕</button>
        </div>
      </div>
    `).join('')}
    <div class="total-row big mt-2"><span>Total</span><span>${fmtR(total)}</span></div>
  `;
}

async function salvarPedido() {
  const cliente_id = document.getElementById('ped-cli').value || null;
  const funcionario_id = document.getElementById('ped-func').value || null;
  const tipo = document.getElementById('ped-tipo').value;
  const observacoes = document.getElementById('ped-obs').value;

  if (window._pedidoItens.length === 0) return toast('Adicione ao menos um produto', 'error');

  const total = window._pedidoItens.reduce((s, i) => s + i.preco_unitario * i.quantidade, 0);

  try {
    await api('POST', '/api/pedidos', {
      cliente_id, funcionario_id, tipo, observacoes,
      itens: window._pedidoItens, total, status: 'aberto'
    });
    toast('Pedido criado!', 'success');
    closeModal();
    renderPedidos();
  } catch (e) {
    toast('Erro: ' + e.message, 'error');
  }
}

async function mudarStatusPedido(id, status) {
  try {
    await api('PUT', `/api/pedidos/${id}`, { status });
    const pedido = window._pedidosCache?.find(p => p.id === id);
    if (pedido) pedido.status = status;
    toast('Status atualizado!', 'success');
  } catch (e) {
    toast('Erro: ' + e.message, 'error');
    renderPedidos();
  }
}

async function adicionarCategoria() {
  const nome = document.getElementById('nova-cat').value.trim();
  if (!nome) return toast('Digite o nome da categoria', 'error');
  try {
    await api('POST', '/api/categorias', { nome });
    document.getElementById('nova-cat').value = '';
    toast('Categoria adicionada!', 'success');
    const cats = await api('GET', '/api/categorias');
    STATE.categorias = Array.isArray(cats) ? cats : [];
    renderConfiguracoes();
  } catch (e) {
    toast('Erro: ' + e.message, 'error');
  }
}

async function removerCategoria(id) {
  try {
    await api('DELETE', `/api/categorias/${id}`);
    STATE.categorias = STATE.categorias.filter(c => c.id !== id);
    renderConfiguracoes();
  } catch (e) {
    toast('Erro: ' + e.message, 'error');
  }
}

          alertas.expirando_em_breve.map(l => `
            <div class="flex items-center justify-between mb-2" style="padding:8px;background:var(--bg);border-radius:8px">
              <div>
                <div class="font-bold text-sm">${l.nome}</div>
                <div class="text-xs text-muted">${l.telefone||'sem telefone'}</div>
              </div>
              <span class="badge badge-yellow">${new Date(l.trial_expires_at).toLocaleDateString('pt-BR')}</span>
            </div>
          `).join('')}
        ${alertas.bloqueadas.length > 0 ? `
          <div class="card-title mt-3 mb-2" style="font-size:13px">🔴 Bloqueadas (${alertas.bloqueadas.length})</div>
          ${alertas.bloqueadas.slice(0,5).map(l => `
            <div class="flex items-center justify-between mb-1" style="padding:6px 8px">
              <span class="text-sm">${l.nome}</span>
              <span class="text-xs text-muted">${l.telefone||'—'}</span>
            </div>
          `).join('')}
        ` : ''}
      </div>

      <div class="card">
        <div class="card-header"><span class="card-title">💰 Últimos Pagamentos</span></div>
        ${pagamentosRecentes.length === 0 ? '<p class="text-sm text-muted">Nenhum pagamento registrado ainda</p>' :
          pagamentosRecentes.slice(0,8).map(p => `
            <div class="flex items-center justify-between mb-2">
              <div>
                <div class="font-bold text-sm">${p.lojas?.nome || '—'}</div>
                <div class="text-xs text-muted">${new Date(p.pago_em).toLocaleDateString('pt-BR')}</div>
              </div>
              <span class="font-bold" style="color:var(--success)">${fmtR(p.valor)}</span>
            </div>
          `).join('')}
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">🏪 Todas as Lojas</span>
        <div class="flex gap-2">
          <select id="admin-filtro-status" onchange="filtrarAdminLojas()" style="padding:8px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:13px">
            <option value="">Todos status</option>
            <option value="trial">Trial</option>
            <option value="ativo">Ativo</option>
            <option value="bloqueado">Bloqueado</option>
          </select>
          <div class="search-bar" style="max-width:220px">
            <span>🔍</span><input type="text" id="admin-busca-loja" placeholder="Buscar loja..." oninput="filtrarAdminLojas()">
          </div>
        </div>
      </div>
      <div class="table-wrap" id="admin-tabela-lojas">
        ${renderTabelaAdminLojas(window._adminLojas)}
      </div>
    </div>
  `);
}

function renderTabelaAdminLojas(lojas) {
  if (lojas.length === 0) return '<div class="empty-state"><div class="empty-icon">🏪</div><p>Nenhuma loja encontrada</p></div>';
  const statusBadge = { trial: 'badge-blue', ativo: 'badge-green', bloqueado: 'badge-red' };

  return `
    <table>
      <thead><tr><th>Loja</th><th>Tipo</th><th>Status</th><th>Trial expira</th><th>Cadastrada em</th><th>Ações</th></tr></thead>
      <tbody>
        ${lojas.map(l => `
          <tr>
            <td class="font-bold">${l.nome}</td>
            <td class="text-sm text-muted">${l.tipo||'—'}</td>
            <td><span class="badge ${statusBadge[l.status]||'badge-gray'}">${l.status}</span></td>
            <td class="text-sm text-muted">${l.trial_expires_at ? new Date(l.trial_expires_at).toLocaleDateString('pt-BR') : '—'}</td>
            <td class="text-sm text-muted">${new Date(l.criado_em).toLocaleDateString('pt-BR')}</td>
            <td><button class="btn btn-outline btn-sm" onclick="modalAlterarStatusLoja('${l.id}','${l.status}','${(l.nome||'').replace(/'/g,"&#39;")}')">⚙️ Status</button></td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;
}

function filtrarAdminLojas() {
  const busca = (document.getElementById('admin-busca-loja')?.value || '').toLowerCase();
  const status = document.getElementById('admin-filtro-status')?.value || '';
  let lojas = window._adminLojas;
  if (status) lojas = lojas.filter(l => l.status === status);
  if (busca) lojas = lojas.filter(l => l.nome.toLowerCase().includes(busca));
  document.getElementById('admin-tabela-lojas').innerHTML = renderTabelaAdminLojas(lojas);
}

function modalAlterarStatusLoja(id, statusAtual, nome) {
  openModal(`⚙️ Status — ${nome}`, `
    <p class="text-sm text-muted mb-3">Status atual: <strong>${statusAtual}</strong></p>
    <div class="form-group">
      <label>Novo status</label>
      <select id="admin-novo-status">
        <option value="trial" ${statusAtual==='trial'?'selected':''}>Trial</option>
        <option value="ativo" ${statusAtual==='ativo'?'selected':''}>Ativo</option>
        <option value="bloqueado" ${statusAtual==='bloqueado'?'selected':''}>Bloqueado</option>
      </select>
    </div>
    <div class="form-group">
      <label>Estender trial até (opcional, só se for deixar como trial)</label>
      <input type="date" id="admin-novo-trial-expira">
    </div>
    <div class="form-group">
      <label>Motivo (fica registrado no log do servidor)</label>
      <input type="text" id="admin-motivo-status" placeholder="Ex: pagamento confirmado por fora, cortesia...">
    </div>
  `, `
    <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="confirmarAlterarStatusLoja('${id}')">Confirmar</button>
  `, 'modal-sm');
}

async function confirmarAlterarStatusLoja(id) {
  const status = document.getElementById('admin-novo-status').value;
  const trial_expires_at = document.getElementById('admin-novo-trial-expira').value || undefined;
  const motivo = document.getElementById('admin-motivo-status').value;

  try {
    await api('PUT', `/api/admin/lojas/${id}/status`, { status, trial_expires_at, motivo });
    toast('Status atualizado!', 'success');
    closeModal();
    renderAdmin();
  } catch (e) {
    toast('Erro: ' + e.message, 'error');
  }
}


// ============================================================
//  MODAL
// ============================================================
function openModal(title, body, footer, size) {
  const modal = document.getElementById('modal');
  modal.className = `modal ${size || 'modal-md'}`;
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-footer').innerHTML = footer || '';
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
function closeModalOnBg(e) { if (e.target === document.getElementById('modalOverlay')) closeModal(); }

// ============================================================
//  TOAST
// ============================================================
function toast(msg, type = 'success') {
  const c = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type === 'error' ? 'error' : type === 'warning' ? 'warning' : type === 'info' ? 'info' : ''}`;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// Restaura sessão real
(async function() {
  const tk = localStorage.getItem('comercioos_token');
  if (!tk) return;
  STATE.token = tk;
  try {
    const res = await fetch(API + '/api/auth/me', {
      headers: { 'Authorization': 'Bearer ' + tk }
    });
    if (res.ok) {
      const data = await res.json();
      STATE.user = data;
      STATE.loja = data.lojas;
      startApp();
    } else {
      localStorage.removeItem('comercioos_token');
      STATE.token = null;
    }
  } catch(e) {
    // Mantém token e tenta usar mesmo assim
    startApp();
  }
})();
